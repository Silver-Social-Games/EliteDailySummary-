              <span class="select-wrap"><select id="sortBy">
                <option value="urgency"${state.sortBy === "urgency" ? " selected" : ""}>Sort: Urgency + gap</option>
                <option value="priorHigh"${state.sortBy === "priorHigh" ? " selected" : ""}>Prior purchase ↓</option>
                <option value="lifetimeHigh"${state.sortBy === "lifetimeHigh" ? " selected" : ""}>Lifetime purchase ↓</option>
                <option value="gapHigh"${state.sortBy === "gapHigh" ? " selected" : ""}>WoW gap ↓</option>
              </select></span>
            </div>
            <div class="pills" id="reasonPills">${reasonPills}</div>
          </div>
          ${visibleBlocks.map(renderPlayerBlock).join("")}`;

        document.getElementById("search").addEventListener("input", e => { state.search = e.target.value; render(); });
        document.getElementById("agentFilter").addEventListener("change", e => { state.agent = e.target.value; render(); });
        document.getElementById("sortBy").addEventListener("change", e => { state.sortBy = e.target.value; render(); });
        document.getElementById("dayFilter").addEventListener("change", e => { state.dayFilter = e.target.value; render(); });
        document.querySelectorAll("#dayPills .pill").forEach(el => {
          el.addEventListener("click", () => { state.dayFilter = el.dataset.day; render(); });
        });
        document.querySelectorAll("#reasonPills .pill").forEach(el => {
          el.addEventListener("click", () => { state.reason = el.dataset.reason; render(); });
        });
        document.querySelectorAll(".ticket-draft-btn").forEach(el => {
          el.addEventListener("click", () => {
            const player = ALL_PLAYERS.find(p => p.aid === el.dataset.ticketAid);
            if (player) openTicketDraft(player);
          });
        });
        document.title = `Elite Daily Decline Dashboard · ${REPORT.dateStart}`;
      }
      render();
    }
  </script>
</body>
</html>
