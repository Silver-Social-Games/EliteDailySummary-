    :root {

      --fg3: #1414148A;
      --fg4: #1414145C;
      --bg-editor: #FCFCFC;
      --stroke-secondary: #1414141F;
      --stroke-tertiary: #14141414;
      --fill-secondary: #14141424;
      --fill-tertiary: #14141414;

      --cat-green: #1F8A65;
      --cat-yellow: #C08532;
      --cat-cyan: #4C7F8C;
      --marker-success: #1F8A65;
      --marker-danger: #CF2D56;
      --marker-warning: #DB704B;
      --marker-info: #3685BF;
      --marker-neutral: #1414148A;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #E4E4E4EB;
        --fg2: #E4E4E48D;
        --fg3: #E4E4E45E;
        --fg4: #E4E4E442;
        --bg-editor: #F3F3F3;
        --stroke-secondary: #1414141F;
        --stroke-tertiary: #14141420;
        --fill-secondary: #14141418;
        --fill-tertiary: #14141410;
        --fill-quaternary: #1414140C;
        --cat-green: #1F8A65;
        --cat-yellow: #C08532;
        --cat-cyan: #4C7F8C;
        --marker-success: #1F8A65;
        --marker-danger: #CF2D56;
        --marker-warning: #DB704B;
        --marker-info: #3685BF;
        --marker-neutral: #1414148A;

    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg-editor); color: var(--fg); font-family: var(--font); }
    .wrap { padding: 20px; max-width: 100%; }
    .stack { display: flex; flex-direction: column; gap: 16px; }

    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .spacer { flex: 1 1 auto; }
    h1 { margin: 0; font-size: 24px; line-height: 30px; font-weight: 590; }
    h2 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 590; }
    .t-body { font-size: 14px; line-height: 20px; }

    .t-secondary { color: var(--fg2); }
    .t-tertiary { color: var(--fg3); }
    .t-quaternary { color: var(--fg4); }
    .t-danger { color: var(--marker-danger); }
    .t-warning { color: var(--cat-yellow); }
    .t-success { color: var(--cat-green); }
    .t-info { color: var(--cat-cyan); }
    .w-semibold { font-weight: 590; }
    .w-medium { font-weight: 500; }
    a { color: var(--marker-info); text-decoration: none; }

      font-size: 13px;
      line-height: 18px;
      color: var(--fg);
      outline: none;

    input[type="search"] {

      min-width: 200px;
      height: 28px;
      padding: 4px 8px;
      border: 1px solid var(--stroke-secondary);
      border-radius: 6px;
      background: var(--fill-tertiary);
    }
    .select-wrap { position: relative; display: inline-flex; align-items: center; }
    select {
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: 1px solid var(--stroke-tertiary);
      border-radius: 6px;
      padding: 4px 20px 4px 4px;
      cursor: pointer;
      color-scheme: light;
    }
    .select-wrap::after {
      content: "▾";
      position: absolute;
      right: 6px;
      pointer-events: none;
      color: var(--fg2);
      font-size: 10px;
    }

    .pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {

      align-items: center;
      justify-content: center;
      border-radius: 9999px;

      user-select: none;
      font-size: 10px;
      line-height: 12px;
      padding: 2px 6px;
      background: var(--fill-quaternary);
      color: var(--fg2);
      border: none;
      cursor: pointer;
      font-weight: 400;
      transition: color 120ms ease, background 120ms ease;
    }
    .pill.active {
      background: var(--fill-secondary);
      color: var(--fg);
      font-weight: 500;
    }

    .table-frame {

      min-width: 0;
      border: 1px solid var(--stroke-tertiary);
      border-radius: 8px;
      background: var(--bg-editor);
      overflow-x: auto;
      overflow-y: clip;

    table.canvas {

      table-layout: auto;
      font-size: 14px;
      line-height: 20px;
      color: var(--fg);

      font-weight: 600;
      color: var(--fg);
      border-bottom: 1px solid var(--stroke-secondary);
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--bg-editor);
      background-image: linear-gradient(var(--fill-quaternary), var(--fill-quaternary));

    table.canvas td {

      vertical-align: top;
      border-bottom: 1px solid var(--stroke-tertiary);

    table.canvas tbody tr.striped td { background: var(--fill-quaternary); }
    table.canvas .num { text-align: right; }
    table.canvas .center { text-align: center; }

    .cell-marker {
      display: inline-flex;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
      max-width: 100%;
    }
    .marker {
      width: 6px;
      height: 6px;
      margin-top: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .marker-success { background: var(--marker-success); }
    .marker-danger { background: var(--marker-danger); }
    .marker-warning { background: var(--marker-warning); }
    .marker-info { background: var(--marker-info); }
    .marker-neutral { background: var(--marker-neutral); }

    .action-cell { min-width: 200px; max-width: 420px; line-height: 1.5; }
    .p7d-cell { min-width: 160px; max-width: 220px; font-size: 12px; line-height: 1.45; }
    .sep { padding: 0 8px; font-weight: 700; color: var(--fg3); font-size: 15px; }
    .players-table { min-width: 2950px; width: max-content; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-card {
      background: var(--bg-editor);
      border-radius: 12px;
      padding: 20px;
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);

    .modal-card input, .modal-card textarea {
      width: 100%;
      margin-top: 4px;
      margin-bottom: 12px;
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid var(--stroke-secondary);

      color: var(--fg);
      background: var(--bg-editor);

      color: var(--fg-quaternary);
      max-width: 140px;
      line-height: 1.35;
      margin-top: 2px;

          `<span class="${p.zeroDay ? "t-danger w-semibold" : ""}">${esc(p.thisDay)}</span>`,
          `<span class="${p.sortGap >= 2000 ? "t-danger w-semibold" : ""}">${esc(p.priorDay)}</span>`,
          esc(p.purchase7d), esc(p.favouriteGame7d || "—"),
          p.urgency === "Today" ? '<span class="t-danger w-semibold">⚡ Today</span>' : esc(p.urgency),
          renderReason(p.reasonParts, p.reasonTable), renderAction(p.recommendation), ticketHtml(p),
        ]);
        if (filtered.length) {
          playerRows.push(["","","",`<span class="w-semibold">Total (${filtered.length})</span>`,"","","",`<span class="w-semibold">${fmtTotalMoney(priorTotal)}</span>`,"","","","","",""]);
        }
        return `
          <div class="stack-8">
            <div class="row">
              <h2>${esc(block.report.weekday)} · Top 20</h2>
              <div class="spacer"></div>
              <div class="t-small t-tertiary">${filterActive ? `Showing ${filtered.length} of ${block.players.length}` : `${block.players.length} players`}</div>
            </div>
            ${tableHtml(playerHeaders, playerAligns, playerRows.length ? playerRows : [["","","","","","","","","","","","","No matches",""]])}
          </div>`;
      }

      function render() {
        const visibleBlocks = DAY_BLOCKS.filter(dayMatchesFilter);
        const visibleCount = visibleBlocks.reduce((sum, b) => sum + filterPlayers(b.players).length, 0);
        const filterActive = state.search.trim() || state.agent !== "all" || state.reason !== "all" || state.sortBy !== "urgency";
        const agentOpts = ['<option value="all">All agents</option>']
          .concat((AGENT_OPTIONS || []).map(o => `<option value="${esc(o.value)}"${state.agent === o.value ? " selected" : ""}>${esc(o.label)}</option>`)).join("");
        const daySelectOpts = ['<option value="all">All days</option>']
          .concat(DAY_BLOCKS.map(b => `<option value="${esc(b.report.date)}"${state.dayFilter === b.report.date ? " selected" : ""}>${esc(daySelectLabel(b))}</option>`)).join("");
        const dayPills = ['<button type="button" class="pill' + (state.dayFilter === "all" ? " active" : "") + '" data-day="all">All</button>']
          .concat(DAY_BLOCKS.map(b => `<button type="button" class="pill${state.dayFilter === b.report.date ? " active" : ""}" data-day="${esc(b.report.date)}">${esc(b.dayShort)}</button>`)).join("");
        const reasonPills = ['<button type="button" class="pill' + (state.reason === "all" ? " active" : "") + '" data-reason="all">All reasons</button>']
          .concat(REASONS.map(r => `<button type="button" class="pill${state.reason === r ? " active" : ""}" data-reason="${esc(r)}">${esc(r)}</button>`)).join("");

        document.getElementById("app").innerHTML = `
          <div class="stack-8">
            <h1>Elite Daily Decline Dashboard</h1>
          </div>
          <div class="stack">
            ${DAY_BLOCKS.map(renderSegmentBlock).join("")}
          </div>
          <div class="stack-8">
            <div class="row">
              <h2>Top 20 · WoW Purchase Gaps</h2>
              <div class="spacer"></div>
              <div class="t-small t-tertiary">${filterActive ? `Showing ${visibleCount} of ${REPORT.playerCount}` : `${REPORT.playerCount} players`}</div>
            </div>
            <div class="row">
              <div class="pills" id="dayPills">${dayPills}</div>
              <span class="select-wrap"><select id="dayFilter">${daySelectOpts}</select></span>
            </div>
            <div class="row">
              <input type="search" id="search" placeholder="Search name, AID, agent, reason…" value="${esc(state.search)}">
              <span class="select-wrap" style="flex:0 0 140px"><select id="agentFilter">${agentOpts}</select></span>
              <span class="select-wrap"><select id="sortBy">
                <option value="urgency"${state.sortBy === "urgency" ? " selected" : ""}>Sort: Urgency + gap</option>
                <option value="priorHigh"${state.sortBy === "priorHigh" ? " selected" : ""}>Prior purchase ↓</option>
                <option value="lifetimeHigh"${state.sortBy === "lifetimeHigh" ? " selected" : ""}>Lifetime purchase ↓</option>
                <option value="gapHigh"${state.sortBy === "gapHigh" ? " selected" : ""}>WoW gap ↓</option>
              </select></span>
            </div>
            <div class="pills" id="reasonPills">${reasonPills}</div>
          </div>
          ${visibleBlocks.map(renderPlayerBlock).join("")}`;

        document.getElementById("search").addEventListener("input", e => { state.search = e.target.value; render(); });
        document.getElementById("agentFilter").addEventListener("change", e => { state.agent = e.target.value; render(); });
        document.getElementById("sortBy").addEventListener("change", e => { state.sortBy = e.target.value; render(); });
        document.getElementById("dayFilter").addEventListener("change", e => { state.dayFilter = e.target.value; render(); });
        document.querySelectorAll("#dayPills .pill").forEach(el => {
          el.addEventListener("click", () => { state.dayFilter = el.dataset.day; render(); });
        });
        document.querySelectorAll("#reasonPills .pill").forEach(el => {
          el.addEventListener("click", () => { state.reason = el.dataset.reason; render(); });
        });
        document.querySelectorAll(".ticket-draft-btn").forEach(el => {
          el.addEventListener("click", () => {
            const player = ALL_PLAYERS.find(p => p.aid === el.dataset.ticketAid);
            if (player) openTicketDraft(player);
          });
        });
        document.title = `Elite Daily Decline Dashboard · ${REPORT.dateStart}`;
      }
      render();
    }
  </script>
</body>
</html>
