      min-width: 0;

      const subj = p.ticketSubject || "";
      const preview = subj.length > 28 ? subj.slice(0, 27) + "…" : (subj || "Draft");
      return `<div><button type="button" class="pill ticket-draft-btn" data-ticket-aid="${esc(p.aid)}">Draft</button><div class="ticket-preview">${esc(preview)}</div></div>`;
    }
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); } catch (_) { /* ignore */ }
    }
    function renderTicketModal() {
      const root = document.getElementById("ticketModalRoot");
      if (!ticketDraft) {
        root.innerHTML = "";
        return;
      }
      const p = ticketDraft.player;
      root.innerHTML = `
        <div class="modal-backdrop" id="ticketModalBackdrop">
          <div class="modal-card">
            <div class="w-semibold">Zendesk ticket draft · ${esc(p.name)} (AID ${esc(p.aid)})</div>
            <div class="t-small t-quaternary" style="margin:4px 0 12px">Review only. Edit, copy, then open Zendesk and send manually. Never auto-sent.</div>
            <label class="t-small w-medium">Subject</label>
            <input type="text" id="ticketSubjectInput" value="${esc(ticketDraft.subject)}">
            <label class="t-small w-medium">Message</label>
            <textarea id="ticketBodyInput">${esc(ticketDraft.body)}</textarea>
            <div class="row">
              <button type="button" class="pill" id="ticketCopySubject">Copy subject</button>
              <button type="button" class="pill" id="ticketCopyBody">Copy message</button>
              <button type="button" class="pill" id="ticketCopyAll">Copy subject + message</button>
              <button type="button" class="pill" id="ticketOpenZendesk">Open Zendesk</button>
              <div class="spacer"></div>
              <button type="button" class="pill" id="ticketClose">Close</button>
            </div>
          </div>
        </div>`;
      document.getElementById("ticketSubjectInput").addEventListener("input", e => { ticketDraft.subject = e.target.value; });
      document.getElementById("ticketBodyInput").addEventListener("input", e => { ticketDraft.body = e.target.value; });
      document.getElementById("ticketCopySubject").addEventListener("click", () => copyText(ticketDraft.subject));
      document.getElementById("ticketCopyBody").addEventListener("click", () => copyText(ticketDraft.body));
      document.getElementById("ticketCopyAll").addEventListener("click", () => copyText(`Subject: ${ticketDraft.subject}\n\n${ticketDraft.body}`));
      document.getElementById("ticketOpenZendesk").addEventListener("click", () => { if (p.zendeskUrl) window.open(p.zendeskUrl, "_blank", "noopener,noreferrer"); });
      document.getElementById("ticketClose").addEventListener("click", () => { ticketDraft = null; renderTicketModal(); });
      document.getElementById("ticketModalBackdrop").addEventListener("click", e => {
        if (e.target.id === "ticketModalBackdrop") { ticketDraft = null; renderTicketModal(); }
      });
    }
    function openTicketDraft(p) {
      ticketDraft = {
        player: p,
        subject: p.ticketSubject || "",
        body: p.ticketBody || "",
      };
      renderTicketModal();
    }
    function matchesSearch(row, query) {
      if (!query.trim()) return true;
      const q = query.trim().toLowerCase();
      return [row.name, row.aid, row.agent, row.agentName, row.reason, row.reasonTable,
        row.purchase7d, row.favouriteGame7d, row.recommendation].join(" ").toLowerCase().includes(q);
    }
    function tableHtml(headers, aligns, rows) {
      const th = headers.map((h, i) => `<th class="${aligns[i] || ""}">${esc(h)}</th>`).join("");
      const tb = rows.map((row, ri) => {
        const stripe = ri % 2 === 1 ? " striped" : "";
        return `<tr class="${stripe}">${row.map((cell, ci) => `<td class="${aligns[ci] || ""}">${cell}</td>`).join("")}</tr>`;
      }).join("");
      return `<div class="table-frame"><table class="canvas"><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div>`;
    }

    let state = { search: "", agent: "all", reason: "all", sortBy: "urgency" };
    let ticketDraft = null;

    function render() {
      const filtered = sortPlayers(TOP10.filter(row => {
        if (state.agent !== "all" && row.agent !== state.agent) return false;
        if (state.reason !== "all" && row.reason !== state.reason) return false;
        return matchesSearch(row, state.search);
      }), state.sortBy);
      const priorTotal = filtered.reduce((s, p) => s + p.priorPriorNum, 0);
      const filterActive = state.search.trim() || state.agent !== "all" || state.reason !== "all" || state.sortBy !== "urgency";

      const segHeaders = [
        "Segment",
        `This ${dayShort} Purchase`, `Prior ${dayShort} Purchase`, "Purchase WoW",
        `This ${dayShort} Purchased Players`, `Prior ${dayShort} Purchased Players`,
        "Purchased Players WoW", "Share"
      ];
      const segAligns = ["", "num", "num", "num", "num", "num", "num", ""];
      const segRows = SEGMENTS.map(s => [
        markerCell(s.tone, `<span class="w-semibold">${esc(s.label)}</span>`),
        esc(s.revThis), esc(s.revPrior), wowHtml(s.revWow),
        esc(s.plyThis), esc(s.plyPrior), wowHtml(s.plyWow), esc(s.share)
      ]);

      const playerAligns = ["center", "", "", "", "num", "num", "num", "num", "", "", "center", "", "", "center"];
      const playerRows = filtered.map((p, i) => [
        markerCell(p.tone, esc(String(i + 1))),
        esc(p.agentName), aidHtml(p), esc(p.name),
        moneyHtml(p.lifetimePurchase, p.lifetimePurchasedNum >= 50000),
        holdHtml(p.lifetimeHold),
        moneyHtml(p.thisDay, p.zeroDay),
        moneyHtml(p.priorDay, p.sortGap >= 2000),
        p7dHtml(p.purchase7d),
        esc(p.favouriteGame7d || "—"),
        urgencyHtml(p.urgency),
        renderReason(p.reasonParts, p.reasonTable),
        renderAction(p.recommendation),
        ticketHtml(p),
      ]);
      if (filtered.length) {
        playerRows.push([
          "", "", "", '<span class="w-semibold">Total</span>', "", "", "",
          `<span class="w-semibold">${fmtTotalMoney(priorTotal)}</span>`,
          "", "", "", "", "", ""
        ]);
      }

      const playerHeaders = [
        "#", "Agent Name", "AID", "Name",
        TITLES.lifetimePurchase, TITLES.lifetimeHold,
        TITLES.thisPurchase, TITLES.priorPurchase,
        TITLES.purchase7d, TITLES.favouriteGame7d,
        "Urgency", "Reason", "Recommendation", "Ticket"
      ];

      const pills = ['<button type="button" class="pill' + (state.reason === "all" ? " active" : "") + '" data-reason-idx="-1">All reasons</button>']
        .concat(REASONS.map((r, idx) =>
          `<button type="button" class="pill${state.reason === r ? " active" : ""}" data-reason-idx="${idx}">${esc(r)}</button>`
        )).join("");

      const agentOpts = ['<option value="all">All agents</option>']
        .concat(AGENTS.map(a => `<option value="${esc(a)}"${state.agent === a ? " selected" : ""}>${esc(a)}</option>`))
        .join("");

      document.getElementById("app").innerHTML = `
        <div class="stack-8">
          <h1>Elite Daily Decline Dashboard</h1>
          <div class="t-small t-tertiary">${esc(REPORT.weekday)} ${esc(REPORT.date)} vs prior ${esc(REPORT.weekday)} ${esc(REPORT.priorDate)}</div>
        </div>
        <div class="stack-8">
          <h2>${esc(REPORT.weekday)} vs last ${esc(REPORT.weekday)} · Elite &amp; Jackpota</h2>
          ${tableHtml(segHeaders, segAligns, segRows)}
          <div class="t-small t-secondary">${esc(REPORT.headline)}</div>
        </div>
        <div class="stack-8">
          <div class="row">
            <h2>Top 20 · WoW Purchase Gaps</h2>
            <div class="spacer"></div>
            <div class="t-small t-tertiary">${filterActive ? `Showing ${filtered.length} of ${TOP10.length}` : `${TOP10.length} players`}</div>
          </div>
          <div class="row">
            <input type="search" id="search" placeholder="Search name, AID, agent, reason…" value="${esc(state.search)}">
            <span class="select-wrap" style="flex:0 0 140px"><select id="agentFilter">${agentOpts}</select></span>
            <span class="select-wrap" style="flex:0 0 180px"><select id="sortBy">
              <option value="urgency"${state.sortBy === "urgency" ? " selected" : ""}>Sort: Urgency + gap</option>
              <option value="priorHigh"${state.sortBy === "priorHigh" ? " selected" : ""}>Prior purchase ↓</option>
              <option value="lifetimeHigh"${state.sortBy === "lifetimeHigh" ? " selected" : ""}>Lifetime purchase ↓</option>
              <option value="gapHigh"${state.sortBy === "gapHigh" ? " selected" : ""}>WoW gap ↓</option>
            </select></span>
          </div>
          <div class="pills" id="reasonPills">${pills}</div>
          <div class="table-frame"><table class="canvas players-table"><thead><tr>${playerHeaders.map((h,i)=>`<th class="${playerAligns[i]||""}">${esc(h)}</th>`).join("")}</tr></thead><tbody>${
            playerRows.length ? playerRows.map((row, ri) => `<tr class="${ri % 2 === 1 ? "striped" : ""}">${row.map((cell, ci) => `<td class="${playerAligns[ci]||""} ${ci===11?"reason-cell":""} ${ci===12?"action-cell":""} ${ci===8?"p7d-cell":""}">${cell}</td>`).join("")}</tr>`).join("")
            : `<tr><td colspan="14" class="t-small t-secondary">No players match the current filters.</td></tr>`
          }</tbody></table></div>
        </div>
      `;

      document.getElementById("search").addEventListener("input", e => { state.search = e.target.value; render(); });
      document.getElementById("agentFilter").addEventListener("change", e => { state.agent = e.target.value; render(); });
      document.getElementById("sortBy").addEventListener("change", e => { state.sortBy = e.target.value; render(); });
      document.querySelectorAll("#reasonPills .pill").forEach(el => {
        el.addEventListener("click", () => {
          const idx = parseInt(el.dataset.reasonIdx, 10);
          state.reason = idx < 0 ? "all" : REASONS[idx];
          render();
        });
      });
      document.querySelectorAll(".ticket-draft-btn").forEach(el => {
        el.addEventListener("click", () => {
          const aid = el.dataset.ticketAid;
          const player = TOP10.find(p => p.aid === aid);
          if (player) openTicketDraft(player);
        });
      });
      document.title = `Elite Daily Decline Dashboard · ${REPORT.date}`;
    }
    render();
  </script>
</body>
</html>
