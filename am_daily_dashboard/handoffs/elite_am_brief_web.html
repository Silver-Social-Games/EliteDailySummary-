<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- am-brief-build sources sha256:066d1849ee5281d9c25a9002ce7e67e1a7f669a8655bdc6406f84797759658b3 output sha256:d6d233c4653cdd8e381d9a76b93812d1b86d52785cf2a607cbfae18da06ad756 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elite Dashboard</title>
  <style>
    :root {
      --sidebar-w: 268px;

      --ink:      #14141A;
      --ink-2:    #3D3848;
      --ink-3:    #6B6578;
      --ink-4:    #9490A0;
      --line:     #E6E3ED;
      --line-soft:#F0EDF5;
      --surface:  #FFFFFF;
      --canvas:   #F4F2F8;

      --brand:      #5B21B6;
      --brand-ink:  #4C1D95;
      --brand-soft: #EDE9FE;

      --gold:       #D4AF37;
      --gold-soft:  #C9A227;
      --gold-muted: rgba(212,175,55,.35);
      --sidebar-bg: #08070B;

      --success: #0E9F6E; --success-soft: #E6F7F1;
      --danger:  #E11D48; --danger-soft:  #FEECF1;
      --warning: #D97706; --warning-soft: #FEF3E4;
      --info:    #2563EB; --info-soft:    #E9F0FE;
      --neutral: #64748B; --neutral-soft: #F1F5F9;

      --shadow-sm: 0 1px 2px rgba(20,20,26,.05), 0 1px 3px rgba(20,20,26,.04);
      --shadow-md: 0 6px 20px rgba(20,20,26,.08);
      --shadow-lg: 0 24px 60px rgba(20,20,26,.22);

      --radius:    14px;
      --radius-sm: 9px;
      --font: "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body {
      margin: 0; height: 100%;
      background: var(--canvas); color: var(--ink);
      font-family: var(--font); font-size: 14px; line-height: 20px;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--brand-ink); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ---------- icons ---------- */
    .ic {
      width: 18px; height: 18px; flex: none; display: inline-block; vertical-align: -3px;
      fill: none; stroke: currentColor; stroke-width: 1.75;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .ic-xs { width: 13px; height: 13px; vertical-align: -2px; stroke-width: 2; }
    .ic-sm { width: 15px; height: 15px; vertical-align: -2.5px; }
    .ic-lg { width: 22px; height: 22px; }
    .ic-xl { width: 26px; height: 26px; }

    /* ---------- app frame ---------- */
    .app { display: flex; min-height: 100vh; }

    .sidebar {
      width: var(--sidebar-w); flex: none; position: sticky; top: 0;
      height: 100vh; overflow-y: auto; overflow-x: hidden;
      background: var(--sidebar-bg);
      color: #C4B8D4; display: flex; flex-direction: column;
      border-right: 1px solid rgba(255,255,255,.06);
    }
    .sidebar::-webkit-scrollbar { width: 8px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }
    .app.collapsed .sidebar { width: 68px; }
    .app.collapsed .side-label, .app.collapsed .side-group-title,
    .app.collapsed .brand-text, .app.collapsed .am-switch, .app.collapsed .side-foot,
    .app.collapsed .nav-count { display: none; }
    .app.collapsed .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
    .app.collapsed .brand { justify-content: center; }

    .brand {
      display: flex; align-items: center; gap: 11px;
      padding: 18px 18px 14px;
    }
    .brand-rule {
      height: 1px; margin: 0 18px 4px;
      background: linear-gradient(90deg, transparent, var(--gold-muted), transparent);
    }
    .brand-mark {
      width: 36px; height: 36px; flex: none; border-radius: 8px;
      display: grid; place-items: center; overflow: hidden;
      background: rgba(255,255,255,.04);
    }
    .logo-img { display: block; width: auto; max-width: 100%; object-fit: contain; }
    .brand-text { min-width: 0; }
    .brand-title { font-size: 14px; font-weight: 650; color: #F4F2F8; letter-spacing: -.01em; }
    .brand-sub { font-size: 11.5px; color: #8B819E; margin-top: 1px; white-space: nowrap; }

    .am-switch { padding: 14px 14px 4px; }
    .am-switch-title {
      font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
      color: #6B7C99; margin: 0 4px 8px;
    }
    .am-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .am-chip {
      font: inherit; font-size: 12px; font-weight: 550; line-height: 16px;
      padding: 5px 10px; border-radius: 8px; cursor: pointer;
      background: rgba(255,255,255,.06); color: #B4C2D6;
      border: 1px solid transparent; transition: background .12s, color .12s;
    }
    .am-chip:hover { background: rgba(255,255,255,.12); color: #F1F5F9; }
    .am-chip.active {
      background: var(--brand);
      color: #fff; border-color: rgba(255,255,255,.18);
      box-shadow: 0 3px 10px rgba(91,33,182,.35);
    }

    .side-nav { padding: 10px 12px 18px; flex: 1 1 auto; }
    .side-group-title {
      font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: #62748F; margin: 18px 8px 6px; padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .side-nav > .side-group-title:first-child { border-top: none; padding-top: 0; margin-top: 8px; }
    .side-group-title.g-manager    { color: #D4AF37; }
    .side-group-title.g-performance { color: #86EFC4; }
    .side-group-title.g-operations  { color: #93C5FD; }
    .side-group-title.g-gaps        { color: #FCD9A0; }
    .side-group-title.g-brand       { color: #C4B5FD; }
    .side-group-title.g-games       { color: #5EEAD4; }
    .side-group-title.g-outreach      { color: #F9A8D4; }
    .side-section-title {
      font-size: 10px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase;
      color: #4B6478; margin: 8px 8px 4px 14px;
    }
    .nav-item.soon { opacity: .82; }
    .nav-soon {
      font-size: 9px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase;
      padding: 2px 6px; border-radius: 999px;
      background: rgba(255,255,255,.07); color: #7B8CA8;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 8px 10px; margin-bottom: 2px; border-radius: 9px;
      font: inherit; font-size: 13.5px; text-align: left; cursor: pointer;
      background: transparent; border: none; color: #AFBDD1;
      transition: background .12s, color .12s;
    }
    .nav-item:hover { background: rgba(255,255,255,.06); color: #F4F2F8; }
    .nav-item.active {
      background: rgba(91,33,182,.22); color: #FFFFFF; font-weight: 600;
      box-shadow: inset 2px 0 0 var(--gold);
    }
    .nav-item.active .ic { color: #C4B5FD; }
    .nav-item .ic { color: #7B8CA8; }
    .side-label { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-count {
      font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums;
      padding: 1px 7px; border-radius: 999px;
      background: rgba(255,255,255,.09); color: #93A5BF;
    }
    .nav-count.hot { background: rgba(225,29,72,.20); color: #FDA4AF; }
    .nav-count.warm { background: rgba(217,119,6,.20); color: #FCD9A0; }
    .nav-count.good { background: rgba(14,159,110,.18); color: #86EFC4; }
    .side-foot {
      padding: 12px 18px 16px; border-top: 1px solid rgba(255,255,255,.07);
      font-size: 11px; color: #64748B; line-height: 1.5;
    }

    /* ---------- main ---------- */
    .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 10px;
      padding: 14px 26px; background: rgba(255,255,255,.92);
      backdrop-filter: saturate(1.6) blur(10px);
      border-bottom: 1px solid var(--gold-muted);
    }
    .btn-ghost {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line);
      background: transparent; font: inherit; font-size: 12.5px; font-weight: 520;
      color: var(--ink-3); cursor: pointer; transition: all .12s;
    }
    .btn-ghost:hover { color: var(--ink); border-color: var(--ink-4); background: #FAFBFD; }
    .export-btn { color: var(--brand); }
    .export-btn:hover { color: var(--brand-ink); border-color: var(--brand); background: var(--brand-soft); }
    .topbar-trail {
      display: flex; align-items: stretch; gap: 8px; flex: none;
    }
    .crumb-top.g-manager    { color: #B8922E; }
    .crumb-top.g-performance { color: #0E9F6E; }
    .crumb-top.g-operations  { color: #2563EB; }
    .crumb-top.g-gaps        { color: #D97706; }
    .crumb-top.g-brand       { color: #6D5CE0; }
    .crumb-top.g-games       { color: #14B8A6; }
    .crumb-top.g-outreach    { color: #DB2777; }
    .icon-btn {
      width: 32px; height: 32px; flex: none; display: grid; place-items: center;
      border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
      color: var(--ink-3); cursor: pointer; transition: all .12s;
    }
    .icon-btn:hover { color: var(--ink); border-color: var(--ink-4); box-shadow: var(--shadow-sm); }
    .crumb { min-width: 0; }
    .crumb-top {
      font-size: 10.5px; font-weight: 700; letter-spacing: .09em;
      text-transform: uppercase; color: var(--ink-4);
    }
    .crumb-title {
      font-size: 19px; font-weight: 650; letter-spacing: -.02em; color: var(--ink);
      line-height: 25px; display: flex; align-items: center; gap: 9px;
    }
    .spacer { flex: 1 1 auto; }
    .who {
      display: flex; align-items: center; gap: 9px; padding: 4px 12px 4px 5px;
      border-radius: 10px; background: var(--surface); border: 1px solid var(--line);
      box-shadow: var(--shadow-sm); min-height: 40px; max-width: 240px;
    }
    .who-dot {
      width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
      color: #fff; font-size: 11.5px; font-weight: 700; letter-spacing: .02em;
      background: var(--brand);
    }
    .who-name { font-size: 13px; font-weight: 600; line-height: 1.2; }
    .who-copy { min-width: 0; }
    .who-role {
      font-size: 10.5px; color: var(--ink-4); line-height: 1.25;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .content { padding: 20px 24px 48px; display: flex; flex-direction: column; gap: 16px; }

    /* ---------- primitives ---------- */
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .stack-10 { display: flex; flex-direction: column; gap: 10px; }
    .stack-6 { display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 18px; align-items: start; }
    .grid-2.goals-pair { align-items: stretch; }
    .grid-2.goals-pair > .card {
      display: flex; flex-direction: column; height: 100%; min-height: 0;
    }
    .grid-2.goals-pair > .card > .card-body,
    .grid-2.goals-pair > .card > .tbl-wrap,
    .grid-2.goals-pair > .card > table {
      flex: 1 1 auto;
    }
    .goals-leaderboard .tbl-wrap { flex: 1 1 auto; display: flex; flex-direction: column; }
    .goals-leaderboard table { flex: 1 1 auto; }

    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow-sm);
    }
    .card-head {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-bottom: 1px solid var(--line-soft);
    }
    .card-title { font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; }
    .card-sub { font-size: 12px; color: var(--ink-4); }
    .card-body { padding: 14px; }
    .card-body.flush { padding: 0; }
    .card-icon {
      width: 30px; height: 30px; flex: none; border-radius: 9px; display: grid; place-items: center;
      background: var(--brand-soft); color: var(--brand);
    }
    .card-icon .ic {
      display: block; vertical-align: initial; margin: 0;
    }
    .card-icon.success { background: var(--success-soft); color: var(--success); }
    .card-icon.danger  { background: var(--danger-soft);  color: var(--danger); }
    .card-icon.warning { background: var(--warning-soft); color: var(--warning); }
    .card-icon.info    { background: var(--info-soft);    color: var(--info); }
    .card-icon.neutral { background: var(--neutral-soft); color: var(--neutral); }
    .card-icon.brand   { background: var(--brand-soft); color: var(--brand); }

    /* Goals History — one collapsible dropdown per closed month */
    .hist-month {
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--surface); overflow: hidden;
    }
    .hist-summary {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 12px; cursor: pointer; list-style: none;
      font-size: 13px; user-select: none;
    }
    .hist-summary::-webkit-details-marker { display: none; }
    .hist-summary:hover { background: #FAFBFD; }
    .hist-label { font-weight: 600; letter-spacing: -.01em; }
    .hist-caret { display: inline-grid; place-items: center; color: var(--ink-4);
      transition: transform .15s ease; }
    .hist-month[open] .hist-caret { transform: rotate(90deg); }
    .hist-quick { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hist-detail { padding: 4px 12px 12px; border-top: 1px solid var(--line-soft); }

    /* gold accent line — one per card */
    .gold-top {
      border-top: 1px solid var(--gold);
      border-top-left-radius: var(--radius);
      border-top-right-radius: var(--radius);
    }

    /* AM intro — salute at top of Morning Brief, aligned with metric bands */
    .am-intro {
      padding: 16px 18px 17px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 4px solid var(--brand);
      border-radius: var(--radius-sm);
    }
    .intro-salute {
      font-size: 17px;
      font-weight: 650;
      color: var(--ink);
      line-height: 1.35;
      margin-bottom: 6px;
    }
    .intro-body {
      font-size: 15px;
      line-height: 1.55;
      color: var(--ink-2);
    }
    .intro-body strong {
      font-weight: 700;
      color: var(--brand-ink);
    }

    /* segment hero KPI row */
    .segment-hero { overflow: hidden; }
    .segment-hero .card-head, .segment-hero-head { padding: 10px 16px 8px; }
    .segment-hero-body {
      display: grid;
      grid-template-columns: 1fr minmax(220px, 280px);
      gap: 0;
      border-top: 1px solid var(--line-soft);
    }
    .segment-hero-body-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .segment-hero-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    .segment-panel {
      padding: 12px 14px;
      border-right: 1px solid var(--line-soft);
    }
    .segment-panel:last-child { border-right: none; }
    @media (max-width: 900px) {
      .segment-hero-body-3 { grid-template-columns: 1fr; }
      .segment-panel { border-right: none; border-bottom: 1px solid var(--line-soft); }
      .segment-panel:last-child { border-bottom: none; }
    }
    @media (max-width: 720px) {
      .segment-hero-grid { grid-template-columns: 1fr; }
    }
    .segment-panel-head {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    }
    .segment-panel-title {
      font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--ink-3);
    }
    .segment-metric { margin-bottom: 12px; }
    .segment-metric:last-child { margin-bottom: 0; }
    .segment-metric-label {
      font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
      color: var(--ink-4); margin-bottom: 4px;
    }
    .segment-metric-row {
      display: flex; align-items: center; justify-content: flex-start;
      gap: 8px; flex-wrap: wrap;
    }
    .segment-metric-value {
      font-size: 26px; line-height: 30px; font-weight: 700; letter-spacing: -.03em;
      color: var(--ink); font-variant-numeric: tabular-nums; flex: none;
    }
    .segment-metric-value.sm { font-size: 22px; line-height: 26px; }
    .segment-metric-row .wow-pill { flex: none; }
    .segment-foot { margin-top: 10px; }
    .segment-empty { padding: 12px 0; }

    .segment-metric-foot { margin-top: 4px; line-height: 1.35; }
    .geo-panel .geo-chart-body {
      display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; padding: 4px 0 8px;
    }
    .geo-bar-chart { display: flex; flex-direction: column; gap: 6px; width: 100%; min-width: 220px; }
    .geo-bar-head, .geo-bar-row {
      display: grid; grid-template-columns: 34px minmax(0, 1fr) 38px 44px; gap: 6px; align-items: center;
    }
    .geo-bar-row-other { margin-top: 2px; padding-top: 6px; border-top: 1px dashed var(--line-soft); }
    .geo-bar-row-other .geo-bar-label { color: var(--ink-3); }
    .geo-bar-head { padding: 0 2px 4px; }
    .geo-bar-head span:not(:first-child) { text-align: right; }
    .geo-bar-label { font-weight: 700; color: var(--ink-2); font-size: 12px; }
    .geo-bar-track {
      height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden;
    }
    .geo-bar-fill { display: block; height: 100%; border-radius: 999px; min-width: 4px; }
    .geo-bar-fill-muted { opacity: .55; }
    .geo-bar-pct { font-weight: 700; font-size: 12px; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
    .geo-bar-count { font-size: 11px; color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
    .geo-bar-foot, .geo-period { margin-top: 2px; line-height: 1.35; }
    .ticket-when { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; min-width: 210px; }
    .ticket-when-line { display: flex; flex-direction: column; gap: 1px; font-size: 11.5px; line-height: 1.25; min-width: 0; }
    .ticket-when-label { font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--ink-4); }
    .ticket-when-date { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .badge.neutral-soft { background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); font-weight: 600; }
    .score-meter.single .trk.kpi { flex: 1 1 auto; }
    @media (max-width: 900px) {
      .segment-hero-body { grid-template-columns: 1fr; }
    }

    .coming-soon { padding: 0; min-height: 420px; display: flex; align-items: center; justify-content: center; }
    .coming-soon-inner {
      text-align: center; padding: 48px 28px; max-width: 360px; margin: 0 auto;
    }
    .coming-soon-graphic { margin: 0 auto 20px; width: 120px; height: 100px; }
    .coming-soon-title {
      font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin: 0;
      color: var(--ink);
    }

    /* ---------- CRM offer calendar ---------- */
    .crm-view .crm-filters { display: flex; flex-wrap: wrap; gap: 20px 28px; }
    .crm-filter-label {
      font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: var(--ink-3); margin-bottom: 7px;
    }
    .crm-chip { font-size: 12px; }
    .crm-dot {
      width: 8px; height: 8px; border-radius: 999px; display: inline-block; flex-shrink: 0;
    }
    .crm-state { margin: 0; }
    .crm-today-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px;
    }
    .crm-cycle-tag {
      font-size: 11px; line-height: 16px; color: var(--ink-3); margin-bottom: 5px; font-weight: 600;
    }
    .crm-board.desktop {
      display: grid; column-gap: 8px; row-gap: 8px; align-items: stretch;
      grid-template-columns: 72px repeat(var(--crm-cols, 7), minmax(0, 1fr));
    }
    .crm-board.mobile { display: none; }
    .crm-cycle-spacer { min-width: 0; }
    .crm-day-head {
      text-align: center; padding-bottom: 6px; border-bottom: 2px solid var(--line);
      font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      color: var(--ink-3);
    }
    .crm-day-head.today { color: var(--brand-ink); border-bottom-color: var(--brand); }
    .crm-cycle-label {
      display: flex; flex-direction: column; justify-content: center; padding-right: 6px;
    }
    .crm-cycle-label strong { font-size: 11px; line-height: 16px; color: var(--ink-2); }
    .crm-cycle-label span { font-size: 11px; line-height: 16px; color: var(--ink-3); }
    .crm-box {
      min-height: 132px; border-radius: var(--radius-sm); overflow: hidden;
      display: flex; flex-direction: column; border: 1px solid var(--line); border-left-width: 3px;
      background: var(--surface);
    }
    .crm-box.muted { opacity: .45; background: var(--neutral-soft); }
    .crm-box.today { box-shadow: 0 0 0 2px rgba(79,70,229,.18); }
    .crm-box-head {
      min-height: 42px; flex-shrink: 0; padding: 8px 10px; display: flex; align-items: center;
      justify-content: center; text-align: center; border-bottom: 1px solid var(--line-soft);
    }
    .crm-box-link, .crm-box-head span {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      font-size: 11.5px; line-height: 15px; font-weight: 650; color: inherit; text-decoration: none;
    }
    .crm-box-link:hover { text-decoration: underline; text-underline-offset: 2px; }
    .crm-box-body { flex: 1; display: flex; flex-direction: column; padding: 8px 10px 10px; }
    .crm-box-cap { font-size: 11px; line-height: 14px; color: var(--ink-3); }
    .crm-box-lead { font-size: 19px; line-height: 24px; font-weight: 700; padding-top: 2px; }
    .crm-box-follow {
      margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line-soft);
      font-size: 11px; line-height: 15px; color: var(--ink-3);
    }
    .crm-box-follow strong { color: var(--ink); font-weight: 650; }
    .crm-day-block { margin-bottom: 16px; }
    .crm-day-block-title {
      font-weight: 650; padding-bottom: 6px; margin-bottom: 8px;
      border-bottom: 2px solid var(--line); font-size: 13px;
    }
    .crm-day-block-title.today { color: var(--brand-ink); border-bottom-color: var(--brand); }
    .crm-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 900px) {
      .crm-board.desktop { display: none; }
      .crm-board.mobile { display: block; }
    }

    .wow-pill {
      display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
      font-size: 12px; font-weight: 620; line-height: 16px;
      padding: 3px 9px; border-radius: 999px;
    }
    .wow-pill.success { background: var(--success-soft); color: #0B7B56; }
    .wow-pill.danger  { background: var(--danger-soft);  color: #BE123C; }
    .wow-pill.neutral { background: var(--neutral-soft); color: var(--ink-3); }

    /* reference-style KPI band — one card, metrics in a row */
    .metric-band { overflow: hidden; }
    .metric-band-head { padding: 10px 14px 8px; border-bottom: 1px solid var(--line-soft); }
    .metric-band-grid {
      display: grid;
      grid-template-columns: repeat(var(--metric-cols, 4), minmax(0, 1fr));
    }
    .metric-cell {
      display: flex; flex-direction: column; gap: 4px;
      padding: 12px 12px; text-align: left;
      border: none; background: transparent; font: inherit;
      border-right: 1px solid var(--line-soft);
      min-width: 0;
    }
    .metric-cell:last-child { border-right: none; }
    button.metric-cell { cursor: pointer; transition: background .12s; }
    button.metric-cell:hover { background: var(--line-soft); }
    .metric-label {
      font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
      color: var(--ink-4); line-height: 1.3;
    }
    .metric-value {
      font-size: 24px; line-height: 28px; font-weight: 700; letter-spacing: -.02em;
      color: var(--ink); font-variant-numeric: tabular-nums;
    }
    .metric-value.sm { font-size: 20px; line-height: 24px; }
    .metric-foot { font-size: 11px; color: var(--ink-4); line-height: 1.35; }
    .metric-cell.t-success .metric-value { color: var(--success); }
    .metric-cell.t-danger  .metric-value { color: var(--danger); }
    .metric-cell.t-warning .metric-value { color: var(--warning); }
    .metric-cell.t-info    .metric-value { color: var(--info); }
    .metric-cell.t-brand   .metric-value { color: var(--brand); }
    @media (max-width: 1100px) {
      .metric-band-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric-cell:nth-child(2n) { border-right: none; }
      .metric-cell { border-bottom: 1px solid var(--line-soft); }
    }

    .hero {
      position: relative; overflow: hidden; border-radius: var(--radius);
      padding: 22px 24px; color: #E7ECF6;
      background: linear-gradient(125deg, #1B2440 0%, #232C52 45%, #2C2450 100%);
      box-shadow: var(--shadow-md);
    }
    .hero::after {
      content: ""; position: absolute; right: -80px; top: -110px;
      width: 320px; height: 320px; border-radius: 50%;
      background: radial-gradient(circle, rgba(139,92,246,.34), transparent 68%);
    }
    .hero-line { position: relative; font-size: 14.5px; line-height: 1.65; color: #C3CDE2; }
    .hero-line.lead { font-size: 18px; line-height: 1.5; font-weight: 620; color: #FFFFFF; letter-spacing: -.01em; }
    .hero-line em { font-style: normal; color: #86EFC4; font-weight: 650; }

    /* stat cards */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
    .stat {
      position: relative; text-align: left; font: inherit; cursor: pointer;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px 15px; box-shadow: var(--shadow-sm);
      transition: transform .12s, box-shadow .12s, border-color .12s;
      display: flex; flex-direction: column; gap: 9px; overflow: hidden;
    }
    .stat::before {
      content: none;
    }
    .stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--ink-4); }
    .stat.flat { cursor: default; }
    .stat.flat:hover { transform: none; box-shadow: var(--shadow-sm); border-color: var(--line); }
    .stat-top { display: flex; align-items: center; gap: 8px; }
    .stat-chip {
      width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center;
      background: var(--accent-soft, var(--neutral-soft)); color: var(--accent, var(--neutral));
    }
    .stat-label {
      font-size: 11.5px; font-weight: 600; letter-spacing: .02em; color: var(--ink-3);
      text-transform: uppercase;
    }
    .stat-value {
      font-size: 25px; line-height: 30px; font-weight: 680; letter-spacing: -.025em;
      color: var(--ink); font-variant-numeric: tabular-nums;
    }
    .stat-value.sm { font-size: 20px; line-height: 26px; }
    .stat-foot { font-size: 11.5px; color: var(--ink-4); }
    .stat.t-success { --accent: var(--success); --accent-soft: var(--success-soft); }
    .stat.t-danger  { --accent: var(--danger);  --accent-soft: var(--danger-soft); }
    .stat.t-warning { --accent: var(--warning); --accent-soft: var(--warning-soft); }
    .stat.t-info    { --accent: var(--info);    --accent-soft: var(--info-soft); }
    .stat.t-brand   { --accent: var(--brand);   --accent-soft: var(--brand-soft); }
    .stat.t-neutral { --accent: var(--neutral); --accent-soft: var(--neutral-soft); }

    /* text tones */
    .t-secondary { color: var(--ink-2); }
    .t-tertiary  { color: var(--ink-3); }
    .t-quaternary{ color: var(--ink-4); }
    .t-danger    { color: var(--danger); }
    .t-warning   { color: var(--warning); }
    .t-success   { color: var(--success); }
    .t-info      { color: var(--info); }
    .t-neutral   { color: var(--ink-3); }
    .t-small { font-size: 12px; line-height: 17px; }
    .w-semibold { font-weight: 640; }
    .num { font-variant-numeric: tabular-nums; }

    /* badges */
    .badge {
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
      font-size: 11.5px; font-weight: 620; line-height: 16px;
      padding: 3px 9px; border-radius: 999px;
      background: var(--neutral-soft); color: var(--ink-2);
    }
    .badge.success { background: var(--success-soft); color: #0B7B56; }
    .badge.danger  { background: var(--danger-soft);  color: #BE123C; }
    .badge.warning { background: var(--warning-soft); color: #B45309; }
    .badge.info    { background: var(--info-soft);    color: #1D4ED8; }
    .badge.brand   { background: var(--brand-soft);   color: var(--brand-ink); }

    /* controls */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 9px; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid var(--line-soft);
    }
    .search {
      position: relative; display: inline-flex; align-items: center;
      flex: 1 1 240px; max-width: 340px; min-width: 190px;
    }
    .search .ic { position: absolute; left: 10px; color: var(--ink-4); pointer-events: none; }
    input[type="search"] {
      width: 100%; height: 34px; padding: 4px 10px 4px 32px;
      font: inherit; font-size: 13px; color: var(--ink);
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--surface); outline: none; appearance: none; -webkit-appearance: none;
      transition: border-color .12s, box-shadow .12s;
    }
    input[type="search"]:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.13); }
    input[type="search"]::-webkit-search-decoration,
    input[type="search"]::-webkit-search-cancel-button,
    input[type="search"]::-webkit-search-results-button,
    input[type="search"]::-webkit-search-results-decoration { -webkit-appearance: none; appearance: none; display: none; }

    .select-wrap { position: relative; display: inline-flex; align-items: center; }
    .select-wrap .ic { position: absolute; right: 9px; pointer-events: none; color: var(--ink-4); }
    select {
      font: inherit; font-size: 13px; color: var(--ink); height: 34px;
      padding: 4px 30px 4px 11px; cursor: pointer; outline: none;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--surface); appearance: none; -webkit-appearance: none;
      transition: border-color .12s, box-shadow .12s;
    }
    select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.13); }

    .chip {
      font: inherit; font-size: 12px; font-weight: 550; line-height: 16px;
      padding: 5px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap;
      background: var(--surface); color: var(--ink-2); border: 1px solid var(--line);
      transition: all .12s;
    }
    .chip:hover { border-color: var(--ink-4); color: var(--ink); }
    .chip.active, .chip[aria-pressed="true"] {
      background: var(--brand-soft); color: var(--brand-ink);
      border-color: var(--brand); font-weight: 600;
    }
    .crm-chip.active .crm-dot { box-shadow: 0 0 0 2px var(--surface); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
    .crm-view .chip-row { padding: 0; }

    .btn {
      display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 13px;
      font-weight: 560; padding: 7px 13px; border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
      transition: all .12s;
    }
    .btn:hover { border-color: var(--ink-4); color: var(--ink); box-shadow: var(--shadow-sm); }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn.primary:hover { background: var(--brand-ink); border-color: var(--brand-ink); color: #fff; }
    .btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

    /* tables */
    .table-frame { width: 100%; overflow-x: auto; }
    .table-frame.compact { width: max-content; max-width: 100%; }
    .card.fit-content { width: fit-content; max-width: 100%; }
    .card.top10-card { width: 100%; }
    table.grid.top10-grid { table-layout: fixed; width: 100%; border-collapse: separate; border-spacing: 0; }
    table.grid.top10-grid th,
    table.grid.top10-grid td { padding: 10px 14px; vertical-align: middle; overflow: hidden; }
    table.grid.top10-grid th:nth-child(1), table.grid.top10-grid td:nth-child(1) { width: 44px; }
    table.grid.top10-grid th:nth-child(2), table.grid.top10-grid td:nth-child(2) { width: 96px; }
    table.grid.top10-grid th:nth-child(3), table.grid.top10-grid td:nth-child(3) { width: 16%; }
    table.grid.top10-grid th:nth-child(4), table.grid.top10-grid td:nth-child(4) { width: 9%; }
    table.grid.top10-grid th:nth-child(5), table.grid.top10-grid td:nth-child(5) { width: 18%; }
    table.grid.top10-grid th:nth-child(6), table.grid.top10-grid td:nth-child(6) { width: 8%; }
    table.grid.top10-grid th:nth-child(7), table.grid.top10-grid td:nth-child(7) { width: 10%; }
    table.grid.top10-grid th:nth-child(8), table.grid.top10-grid td:nth-child(8) { width: 10%; }
    table.grid.top10-grid th:nth-child(9), table.grid.top10-grid td:nth-child(9) { width: 9%; }
    table.grid.top10-grid th:nth-child(10), table.grid.top10-grid td:nth-child(10) { width: 8%; }
    .top10-offer, .top10-name {
      display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
    }
    .top10-money { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .topic-stack { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    .ticket-chip { margin: 0 auto; }
    table.grid {
      min-width: 100%; border-collapse: separate; border-spacing: 0;
      font-size: 13.5px; color: var(--ink);
    }
    .table-frame.compact table.grid { min-width: 0; }
    table.grid th {
      position: sticky; top: 0; z-index: 2; white-space: nowrap;
      padding: 10px 14px; text-align: left;
      font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
      color: var(--ink); background: #F0EDF5;
      border-bottom: 1px solid var(--line);
    }
    table.grid td {
      padding: 10px 14px; vertical-align: top;
      border-bottom: 1px solid var(--line-soft);
    }
    table.grid tbody tr:last-child td { border-bottom: none; }
    table.grid tbody tr:hover td { background: #FAFBFF; }
    table.grid tbody tr.total-row td { background: #F8FAFC; font-weight: 600; }
    table.grid tbody tr.total-row:hover td { background: #F8FAFC; }
    table.grid .num { text-align: right; font-variant-numeric: tabular-nums; }
    table.grid .center { text-align: center; }
    table.grid .empty { padding: 34px 14px; text-align: center; color: var(--ink-4); }

    .cell-marker { display: inline-flex; align-items: flex-start; gap: 7px; min-width: 0; max-width: 100%; }
    .marker { width: 6px; height: 6px; margin-top: 7px; border-radius: 50%; flex: none; }
    .marker-success { background: var(--success); }
    .marker-danger  { background: var(--danger); }
    .marker-warning { background: var(--warning); }
    .marker-info    { background: var(--info); }
    .marker-neutral { background: var(--ink-4); }

    .reason-cell {
      min-width: 12rem; max-width: 22rem; white-space: normal;
      overflow-wrap: anywhere; word-break: break-word;
      line-height: 1.65; font-size: 12.5px;
    }
    .action-cell {
      min-width: 10rem; max-width: 18rem; white-space: normal;
      overflow-wrap: anywhere; word-break: break-word;
      line-height: 1.55; font-size: 12.5px;
    }
    .p7d-cell { display: inline-block; min-width: 150px; max-width: 220px; font-size: 12.5px; line-height: 1.5; }
    .sep { padding: 0 7px; color: var(--ink-4); }
    .players-table { width: 100%; min-width: 0; table-layout: auto; }
    .ticket-preview { font-size: 10.5px; color: var(--ink-4); max-width: 150px; line-height: 1.35; margin-top: 3px; }

    /* pagination */
    .pager {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      padding: 11px 16px; border-top: 1px solid var(--line-soft); background: #FCFDFF;
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .pager-info { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .pager-note { font-size: 12px; color: var(--ink-4); }
    .pg {
      min-width: 30px; height: 30px; padding: 0 8px; display: inline-grid; place-items: center;
      font: inherit; font-size: 12.5px; font-weight: 560; font-variant-numeric: tabular-nums;
      border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
      color: var(--ink-2); cursor: pointer; transition: all .12s;
    }
    .pg:hover:not(:disabled) { border-color: var(--ink-4); color: var(--ink); }
    .pg.active { background: var(--ink); border-color: var(--ink); color: #fff; }
    .pg:disabled { opacity: .35; cursor: not-allowed; }
    .pg-gap { color: var(--ink-4); padding: 0 2px; }
    .pager select { height: 30px; font-size: 12.5px; padding: 3px 26px 3px 9px; }

    /* goals */
    .goal-score { display: flex; align-items: baseline; gap: 10px; }
    .goal-pct { font-size: 34px; line-height: 38px; font-weight: 700; letter-spacing: -.03em; }
    .meter { height: 7px; border-radius: 999px; background: var(--neutral-soft); overflow: hidden; }
    .meter > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6366F1, #8B5CF6); }
    .meter.success > span { background: linear-gradient(90deg, #0E9F6E, #34D399); }
    .meter.warning > span { background: linear-gradient(90deg, #D97706, #FBBF24); }
    .meter.danger  > span { background: linear-gradient(90deg, #E11D48, #FB7185); }

    /* Score meter: two separate tracks, the 80-point KPI block and the
       manager's 20, split by a real gap and individually rounded so the two
       never read as one continuous bar. */
    .score-meter { display: flex; gap: 6px; height: 9px; }
    .score-meter .trk {
      display: flex; border-radius: 999px; overflow: hidden;
      background: var(--neutral-soft);
    }
    .score-meter .trk.kpi { flex: 0 0 calc(80% - 6px); }
    .score-meter .trk.mgr { flex: 0 0 20%; }
    .score-meter .trk.pending {
      background: transparent;
      border: 1px dashed var(--line-strong, var(--line));
    }
    .score-meter .fill { height: 100%; border-radius: 999px; }
    .score-meter .fill.success { background: linear-gradient(90deg, #0E9F6E, #34D399); }
    .score-meter .fill.warning { background: linear-gradient(90deg, #D97706, #FBBF24); }
    .score-meter .fill.danger  { background: linear-gradient(90deg, #E11D48, #FB7185); }
    .score-meter .fill.mgr     { background: linear-gradient(90deg, #6D5CE0, #9386F2); }
    .score-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11.5px; color: var(--ink-4); }
    .score-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    .score-legend i.lg-success { background: #34D399; }
    .score-legend i.lg-warning { background: #FBBF24; }
    .score-legend i.lg-danger  { background: #FB7185; }
    .score-legend i.lg-mgr     { background: #9386F2; }
    .t-manager { color: #9386F2; }
    .note { font-size: 11.5px; line-height: 1.6; color: var(--ink-4); }

    /* ---------- archive calendar ---------- */
    .cal-wrap { position: relative; flex: none; display: flex; align-items: stretch; }
    .cal-btn {
      display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 10px 4px 8px;
      border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
      color: var(--ink-2); cursor: pointer; font: inherit; transition: all .12s;
    }
    .cal-btn-text { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; line-height: 1.1; text-align: left; }
    .cal-btn-kicker { font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-4); }
    .cal-btn-value { font-size: 12px; font-weight: 650; color: var(--ink); white-space: nowrap; }
    .cal-chev { color: var(--ink-4); flex: none; }
    .cal-btn:hover { color: var(--ink); border-color: var(--ink-4); box-shadow: var(--shadow-sm); }
    .cal-pop {
      position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; width: 276px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: var(--shadow-md); padding: 12px;
    }
    .cal-head { display: flex; align-items: center; gap: 6px; margin-bottom: 9px; }
    .cal-title { flex: 1 1 auto; text-align: center; font-size: 12.5px; font-weight: 700; }
    .cal-nav {
      width: 26px; height: 26px; flex: none; display: grid; place-items: center;
      border-radius: 7px; border: 1px solid var(--line); background: var(--surface);
      color: var(--ink-3); cursor: pointer;
    }
    .cal-nav:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-4); }
    .cal-nav:disabled { opacity: .35; cursor: default; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dow {
      text-align: center; font-size: 10px; font-weight: 700; letter-spacing: .04em;
      color: var(--ink-4); padding-bottom: 3px;
    }
    .cal-day {
      aspect-ratio: 1 / 1; display: grid; place-items: center; border-radius: 8px;
      border: 1px solid transparent; background: none; font: inherit; font-size: 12px;
      color: var(--ink-4); cursor: default; padding: 0;
    }
    .cal-day.has {
      color: var(--ink); font-weight: 600; cursor: pointer;
      background: var(--neutral-soft); border-color: var(--line);
    }
    .cal-day.has:hover { border-color: var(--brand, var(--ink-4)); color: var(--ink); }
    .cal-day.today { outline: 2px solid var(--brand, #6366F1); outline-offset: -2px; }
    .cal-day.empty { visibility: hidden; }
    .cal-foot { margin-top: 9px; font-size: 11px; color: var(--ink-4); line-height: 1.5; }
    .cal-recent { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line-soft); }
    .cal-recent-label { font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-4); margin-bottom: 6px; }
    .cal-recent-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .cal-recent-btn {
      border: 1px solid var(--line); background: var(--surface); border-radius: 6px;
      padding: 3px 8px; font-size: 11px; font-weight: 600; color: var(--ink-2); cursor: pointer;
    }
    .cal-recent-btn:hover { border-color: var(--brand); color: var(--brand-ink); }
    .cal-recent-btn.brand { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-ink); font-weight: 650; }

    /* gate */
    .gate {
      max-width: 430px; margin: 60px auto; text-align: center;
      background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
      padding: 34px 30px; box-shadow: var(--shadow-md);
    }
    .gate-mark {
      width: auto; height: auto; margin: 0 auto 16px; border-radius: 0; display: grid; place-items: center;
      background: transparent; box-shadow: none;
    }
    .gate h2 { margin: 0 0 6px; font-size: 19px; font-weight: 660; letter-spacing: -.02em; }
    .gate p { margin: 0 0 20px; font-size: 13px; color: var(--ink-3); line-height: 1.6; }
    .gate input {
      width: 100%; min-height: 48px; height: 48px; text-align: center; letter-spacing: .28em;
      font: inherit; font-size: 16px; touch-action: manipulation;
      border: 1px solid var(--line); border-radius: var(--radius-sm); outline: none; color: var(--ink);
      background: var(--surface); position: relative; z-index: 1;
    }
    .gate input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.13); }
    .gate .err { color: var(--danger); font-size: 12.5px; margin-top: 10px; min-height: 17px; }

    /* modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,.52); backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 22px;
    }
    .modal-card {
      background: var(--surface); border-radius: 18px; max-width: 700px; width: 100%;
      max-height: 90vh; overflow: auto; box-shadow: var(--shadow-lg);
    }
    .modal-head {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 18px 20px 14px; border-bottom: 1px solid var(--line-soft);
    }
    .modal-body { padding: 18px 20px; }
    .modal-foot {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 14px 20px; border-top: 1px solid var(--line-soft); background: #FBFCFE;
      border-radius: 0 0 18px 18px;
    }
    .field-label {
      font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
      color: var(--ink-3); margin-bottom: 6px;
    }
    .modal-card input[type="text"], .modal-card textarea {
      width: 100%; margin-bottom: 16px; padding: 9px 11px; font: inherit; font-size: 13px;
      border-radius: var(--radius-sm); border: 1px solid var(--line);
      color: var(--ink); background: var(--surface); outline: none;
    }
    .modal-card input[type="text"]:focus, .modal-card textarea:focus {
      border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.13);
    }
    .modal-card textarea { resize: vertical; min-height: 190px; line-height: 1.6; }

    .toast {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: #fff; font-size: 13px; font-weight: 550;
      padding: 9px 16px; border-radius: 999px; z-index: 1200; box-shadow: var(--shadow-lg);
      display: flex; align-items: center; gap: 7px;
    }

    @media (max-width: 900px) {
      .sidebar { position: fixed; z-index: 50; transform: translateX(-100%); transition: transform .18s; }
      .app.mobile-open .sidebar { transform: translateX(0); }
      .content, .topbar { padding-left: 16px; padding-right: 16px; }
    }
    @media print {
      .sidebar, .topbar, .toolbar, .pager, .chip-row { display: none !important; }
      .content { padding: 0; }
      .card { break-inside: avoid; box-shadow: none; }
    }
  </style>

  var BAR_COLORS = [

  function normalizeGeoSlices(slices) {
    const rows = slices.filter((sl) => String(sl.state || "").toUpperCase() !== "TOTAL");
    let unknown = 0;
    let knownOther = 0;
    const named = [];
    for (const sl of rows) {
      const state = String(sl.state || "").trim();
      const bettors = Number(sl.bettors) || 0;
      if (state.toUpperCase() === "UNKNOWN") {

      }
      if (state === "Other") {

        continue;
      }
      named.push({ ...sl, state, bettors, share: 0 });
    }
    named.sort((a, b) => b.bettors - a.bettors);
    const otherBettors = knownOther + unknown;
    const other = otherBettors ? { state: "Other", bettors: otherBettors, share: 0 } : null;
    const total = named.reduce((s, x) => s + x.bettors, 0) + ((other == null ? void 0 : other.bettors) || 0);
    const withShare = (sl) => ({

      share: total > 0 ? Math.round(sl.bettors / total * 1e3) / 10 : 0

    return {

      otherKnown: knownOther,
      otherUnknown: unknown,

    const rowCls = summary ? "geo-bar-row geo-bar-row-other" : "geo-bar-row";
    const fillCls = summary ? "geo-bar-fill geo-bar-fill-muted" : "geo-bar-fill";
    return `<div class="${rowCls}">
          <span class="geo-bar-label">${esc(String(sl.state))}</span>
          <div class="geo-bar-track"><span class="${fillCls}" style="width:${width.toFixed(1)}%;background:${color}"></span></div>
          <span class="geo-bar-pct">${pct.toFixed(1)}%</span>

  // src/views/crmCalendar.ts
  function bandFor(leadLow) {
    return CRM_BANDS.find((b) => leadLow >= b.min) || CRM_BANDS[CRM_BANDS.length - 1];
  }
  function cellFor(cycle, weekday) {
    return cycle.cells.find((c) => c.day === weekday);
  }
  function crmBoxHtml(cell, opts) {
    const band = bandFor(cell.lead_low);
    const muted = !!opts.muted;
    const today = !!opts.today;
    const tint = muted ? "" : `background:rgba(${band.rgb},.07);border-color:rgba(${band.rgb},.55);border-left-color:${band.hue};`;
    const headTint = muted ? "" : `background:rgba(${band.rgb},.16);`;
    const follow = cell.follow_label ? `<div class="crm-box-follow">${esc(cell.follow_label)} <strong>${esc(cell.follow_value || "")}</strong></div>` : "";
    const name = esc(cell.campaign);
    const heading = cell.link ? `<a href="${esc(cell.link)}" target="_blank" rel="noopener noreferrer" class="crm-box-link"
          title="Open ${name}">${name}</a>` : `<span>${name}</span>`;
    return `<div class="crm-box${muted ? " muted" : ""}${today ? " today" : ""}" style="${tint}">
        <div class="crm-box-head" style="${headTint}">${heading}</div>
        <div class="crm-box-body">
          <div class="crm-box-cap">First offer</div>
          <div class="crm-box-lead">${esc(cell.lead)}</div>
          ${follow}
        </div>
      </div>`;
  }
  function filterChip(label, pressed, attrs) {
    return `<button type="button" class="chip crm-chip${pressed ? " active" : ""}" aria-pressed="${pressed ? "true" : "false"}" ${attrs}>
        ${label}</button>`;
  }
  function desktopGrid(days, activeBands, reportDay) {
    let html = `<span class="crm-cycle-spacer"></span>` + days.map(
      (d) => `<div class="crm-day-head${d === reportDay ? " today" : ""}">${esc(d.slice(0, 3))}</div>`
    ).join("");
    for (const cycle of CRM_OFFERS.cycles) {
      html += `<div class="crm-cycle-label">
          <strong>${esc(cycle.title)}</strong>
          <span>${esc(cycle.note || "")}</span>
        </div>`;
      html += days.map((d) => {
        const cell = cellFor(cycle, d);
        if (!cell) return `<div class="crm-box empty"></div>`;
        const muted = !activeBands.includes(bandFor(cell.lead_low).id);
        return crmBoxHtml(cell, { muted, today: d === reportDay });
      }).join("");
    }
    return html;
  }
  function mobileBlocks(days, activeBands, reportDay) {
    return days.map((d) => `<section class="crm-day-block">
        <div class="crm-day-block-title${d === reportDay ? " today" : ""}">${esc(d)}</div>
        <div class="crm-pair">
          ${CRM_OFFERS.cycles.map((cycle) => {
      const cell = cellFor(cycle, d);
      if (!cell) return "";
      const muted = !activeBands.includes(bandFor(cell.lead_low).id);
      return `<div>
              <div class="crm-cycle-tag">${esc(cycle.title)}</div>
              ${crmBoxHtml(cell, { muted, today: d === reportDay })}
            </div>`;
    }).join("")}
        </div>
      </section>`).join("");
  }
  function viewCrmCalendar() {
    const reportDay = REPORT.weekday || day || "Monday";
    const allDays = [...CRM_DAY_ORDER];
    const allBandIds = CRM_BANDS.map((b) => b.id);
    const selectedDays = getState("crm_days", allDays);
    const selectedBands = getState("crm_bands", allBandIds);
    const days = allDays.filter((d) => selectedDays.includes(d));
    const showDays = days.length ? days : allDays;
    const activeBands = selectedBands.length ? selectedBands : allBandIds;
    const allDaysSelected = selectedDays.length === allDays.length;
    const allBandsSelected = selectedBands.length === allBandIds.length;
    const dayChips = allDays.map(
      (d) => filterChip(d.slice(0, 3), !allDaysSelected && selectedDays.includes(d), `data-crm-toggle="day" data-crm-value="${esc(d)}"`)
    ).join("");
    const bandChips = CRM_BANDS.map(
      (b) => filterChip(
        `<span class="crm-dot" style="background:${b.hue}"></span>${esc(b.label)}`,
        !allBandsSelected && selectedBands.includes(b.id),
        `data-crm-toggle="band" data-crm-value="${esc(b.id)}"`
      )
    ).join("");
    const stateLine = allDaysSelected && allBandsSelected ? `All ${allDays.length} weekdays \xB7 both cycles` : `Showing ${showDays.length} of ${allDays.length} days` + (allBandsSelected ? ", all first-offer bands" : `, ${activeBands.length} of ${allBandIds.length} first-offer bands highlighted`);
    return `<div class="stack crm-view">
        <div class="card">
          <div class="card-head">
            <span class="card-icon brand">${icon("calendar", "ic-sm")}</span>
            <div>
              <div class="card-title">${esc(CRM_OFFERS.title)}</div>
              <div class="card-sub">${esc(CRM_OFFERS.subtitle)}</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-body stack-10">
            <div class="crm-filters">
              <div>
                <div class="crm-filter-label">Days</div>
                <div class="chip-row">
                  ${filterChip("All", allDaysSelected, 'data-crm-quick="all"')}
                  ${filterChip("Weekend", !allDaysSelected && selectedDays.length === 2 && selectedDays.includes("Friday") && selectedDays.includes("Saturday"), 'data-crm-quick="weekend"')}
                  ${dayChips}
                </div>
              </div>
              <div>
                <div class="crm-filter-label">First offer %</div>
                <div class="chip-row">
                  ${filterChip("All", allBandsSelected, 'data-crm-quick="all-bands"')}
                  ${bandChips}</div>
              </div>
            </div>
            <p class="crm-state t-tertiary t-small">${esc(stateLine)}</p>
            <div class="crm-board desktop" style="--crm-cols:${showDays.length}">
              ${desktopGrid(showDays, activeBands, reportDay)}
            </div>
            <div class="crm-board mobile">
              ${mobileBlocks(showDays, activeBands, reportDay)}
            </div>
          </div>
        </div>
      </div>`;
  }

  function sortAnniversary(rows, mode) {
    const copy = [...rows];
    if (mode === "ltpHigh")
      return copy.sort((a, b) => (b.lifetimePurchasedNum || 0) - (a.lifetimePurchasedNum || 0));
    if (mode === "p7dHigh")
      return copy.sort((a, b) => (b.purchase7dNum || 0) - (a.purchase7dNum || 0));
    if (mode === "name")
      return copy.sort((a, b) => String(a.lastName || a.name).localeCompare(String(b.lastName || b.name)));
    return copy;
  }

            <input type="text" id="tSubject" value="${esc(p.ticketSubject || "")}">
            <div class="field-label">Message</div>
            <textarea id="tBody" rows="11">${esc(p.ticketBody || "")}</textarea>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn" id="copySubject">${icon("copy", "ic-xs")} Subject</button>
            <button type="button" class="btn" id="copyBody">${icon("copy", "ic-xs")} Message</button>
            <button type="button" class="btn" id="copyBoth">${icon("copy", "ic-xs")} Both</button>
            <div class="spacer"></div>
            <button type="button" class="btn primary" id="openZd">${icon("external", "ic-xs")} Open Zendesk</button>
          </div>
        </div>
      </div>`;
    const close = () => {
      app.ticket = null;
      rerender();
    };
    const val = (id) => document.getElementById(id).value;
    const copy = (text, what) => {
      navigator.clipboard.writeText(text);
      toast(what + " copied");
    };
    document.getElementById("backdrop").onclick = (e) => {
      if (e.target.id === "backdrop") close();
    };
    document.getElementById("closeX").onclick = close;
    document.getElementById("copySubject").onclick = () => copy(val("tSubject"), "Subject");
    document.getElementById("copyBody").onclick = () => copy(val("tBody"), "Message");
    document.getElementById("copyBoth").onclick = () => copy(`Subject: ${val("tSubject")}

${val("tBody")}`, "Subject + message");
    document.getElementById("openZd").onclick = () => {
      if (p.zendeskUrl) window.open(p.zendeskUrl, "_blank", "noopener,noreferrer");
    };
  }

  // src/render.ts
  function render() {
    if (app.view === "goals" && !agentBlock().goals) app.view = "home";
    if (VIEWS[app.view] && VIEWS[app.view].managerOnly && HIDE_MANAGER) app.view = "home";
    const body = (VIEW_FN[app.view] || VIEW_FN.home)();
    document.getElementById("root").innerHTML = `<div class="app${app.collapsed ? " collapsed" : ""}${app.mobileOpen ? " mobile-open" : ""}">
        ${sidebar()}
        <div class="main">
          ${topbar()}
          <div class="content">${body}</div>
        </div>
      </div>`;
    document.title = `${REPORT.title || "Elite Dashboard"} \xB7 ${REPORT.date || ""}`;
    bind();
    renderModal();
  }

  // src/main.ts
  document.addEventListener("click", (e) => {
    if (!app.calOpen) return;
    const t = e.target;
    if (t instanceof Element && t.closest(".cal-wrap")) return;
    app.calOpen = false;
    render();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && app.calOpen) {
      app.calOpen = false;
      render();
    }
  });
  setRenderHook(render);
  render();
})();
  </script>
</body>
</html>
