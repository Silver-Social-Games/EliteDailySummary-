<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- am-brief-build sources sha256:b808212285da80c46aa89cfca1d8532a3c46b601d86f3b7a8058cf9d1f463263 output sha256:1596979a50157ec82e51b08c9501f208d2348934e3279b6724ede7eda0e42e98 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elite AM Brief</title>
  <style>
    :root {
      --sidebar-w: 268px;

      --ink:      #0F172A;
      --ink-2:    #334155;
      --ink-3:    #64748B;
      --ink-4:    #94A3B8;
      --line:     #E3E8EF;
      --line-soft:#EFF2F7;
      --surface:  #FFFFFF;
      --canvas:   #F4F6FB;

      --brand:      #4F46E5;
      --brand-ink:  #4338CA;
      --brand-soft: #EEF0FF;

      --success: #0E9F6E; --success-soft: #E6F7F1;
      --danger:  #E11D48; --danger-soft:  #FEECF1;
      --warning: #D97706; --warning-soft: #FEF3E4;
      --info:    #2563EB; --info-soft:    #E9F0FE;
      --neutral: #64748B; --neutral-soft: #F1F5F9;

      --shadow-sm: 0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.04);
      --shadow-md: 0 6px 20px rgba(15,23,42,.08);
      --shadow-lg: 0 24px 60px rgba(15,23,42,.22);

      --radius:    14px;
      --radius-sm: 9px;
      --font: "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body {
      margin: 0; height: 100%;
      background: var(--canvas); color: var(--ink);
      font-family: var(--font); font-size: 14px; line-height: 20px;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--brand-ink); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ---------- icons ---------- */
    .ic {
      width: 18px; height: 18px; flex: none; display: inline-block; vertical-align: -3px;
      fill: none; stroke: currentColor; stroke-width: 1.75;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .ic-xs { width: 13px; height: 13px; vertical-align: -2px; stroke-width: 2; }
    .ic-sm { width: 15px; height: 15px; vertical-align: -2.5px; }
    .ic-lg { width: 22px; height: 22px; }
    .ic-xl { width: 26px; height: 26px; }

    /* ---------- app frame ---------- */
    .app { display: flex; min-height: 100vh; }

    .sidebar {
      width: var(--sidebar-w); flex: none; position: sticky; top: 0;
      height: 100vh; overflow-y: auto; overflow-x: hidden;
      background: linear-gradient(178deg, #131C33 0%, #16203C 42%, #101827 100%);
      color: #CBD5E1; display: flex; flex-direction: column;
      border-right: 1px solid rgba(255,255,255,.06);
    }
    .sidebar::-webkit-scrollbar { width: 8px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }
    .app.collapsed .sidebar { width: 68px; }
    .app.collapsed .side-label, .app.collapsed .side-group-title,
    .app.collapsed .brand-text, .app.collapsed .am-switch, .app.collapsed .side-foot,
    .app.collapsed .nav-count { display: none; }
    .app.collapsed .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
    .app.collapsed .brand { justify-content: center; }

    .brand {
      display: flex; align-items: center; gap: 11px;
      padding: 18px 18px 16px; border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .brand-mark {
      width: 36px; height: 36px; flex: none; border-radius: 11px;
      background: linear-gradient(140deg, #6366F1, #8B5CF6 55%, #D946A6);
      display: grid; place-items: center; color: #fff;
      box-shadow: 0 4px 14px rgba(99,102,241,.42);
    }
    .brand-text { min-width: 0; }
    .brand-title { font-size: 14px; font-weight: 650; color: #F8FAFC; letter-spacing: -.01em; }
    .brand-sub { font-size: 11.5px; color: #7C8DA8; margin-top: 1px; white-space: nowrap; }

    .am-switch { padding: 14px 14px 4px; }
    .am-switch-title {
      font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
      color: #6B7C99; margin: 0 4px 8px;
    }
    .am-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .am-chip {
      font: inherit; font-size: 12px; font-weight: 550; line-height: 16px;
      padding: 5px 10px; border-radius: 8px; cursor: pointer;
      background: rgba(255,255,255,.06); color: #B4C2D6;
      border: 1px solid transparent; transition: background .12s, color .12s;
    }
    .am-chip:hover { background: rgba(255,255,255,.12); color: #F1F5F9; }
    .am-chip.active {
      background: linear-gradient(135deg, #6366F1, #7C4DEA);
      color: #fff; border-color: rgba(255,255,255,.18);
      box-shadow: 0 3px 10px rgba(99,102,241,.4);
    }

    .side-nav { padding: 10px 12px 18px; flex: 1 1 auto; }
    .side-group-title {
      font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
      color: #62748F; margin: 16px 8px 6px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 8px 10px; margin-bottom: 2px; border-radius: 9px;
      font: inherit; font-size: 13.5px; text-align: left; cursor: pointer;
      background: transparent; border: none; color: #AFBDD1;
      transition: background .12s, color .12s;
    }
    .nav-item:hover { background: rgba(255,255,255,.07); color: #F1F5F9; }
    .nav-item.active { background: rgba(99,102,241,.20); color: #FFFFFF; font-weight: 600; }
    .nav-item.active .ic { color: #A5B4FC; }
    .nav-item .ic { color: #7B8CA8; }
    .side-label { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-count {
      font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums;
      padding: 1px 7px; border-radius: 999px;
      background: rgba(255,255,255,.09); color: #93A5BF;
    }
    .nav-count.hot { background: rgba(225,29,72,.20); color: #FDA4AF; }
    .nav-count.warm { background: rgba(217,119,6,.20); color: #FCD9A0; }
    .nav-count.good { background: rgba(14,159,110,.18); color: #86EFC4; }
    .side-foot {
      padding: 12px 18px 16px; border-top: 1px solid rgba(255,255,255,.07);
      font-size: 11px; color: #64748B; line-height: 1.5;
    }

    /* ---------- main ---------- */
    .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 14px;
      padding: 14px 26px; background: rgba(255,255,255,.86);
      backdrop-filter: saturate(1.6) blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .icon-btn {
      width: 32px; height: 32px; flex: none; display: grid; place-items: center;
      border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
      color: var(--ink-3); cursor: pointer; transition: all .12s;
    }
    .icon-btn:hover { color: var(--ink); border-color: var(--ink-4); box-shadow: var(--shadow-sm); }
    .crumb { min-width: 0; }
    .crumb-top {
      font-size: 10.5px; font-weight: 700; letter-spacing: .09em;
      text-transform: uppercase; color: var(--ink-4);
    }
    .crumb-title {
      font-size: 19px; font-weight: 650; letter-spacing: -.02em; color: var(--ink);
      line-height: 25px; display: flex; align-items: center; gap: 9px;
    }
    .spacer { flex: 1 1 auto; }
    .who {
      display: flex; align-items: center; gap: 9px; padding: 5px 12px 5px 6px;
      border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }
    .who-dot {
      width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
      color: #fff; font-size: 11.5px; font-weight: 700; letter-spacing: .02em;
      background: linear-gradient(140deg, #6366F1, #A855F7);
    }
    .who-name { font-size: 13px; font-weight: 600; }
    .who-role { font-size: 11px; color: var(--ink-4); }

    .content { padding: 24px 26px 64px; display: flex; flex-direction: column; gap: 22px; }

    /* ---------- primitives ---------- */
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .stack-10 { display: flex; flex-direction: column; gap: 10px; }
    .stack-6 { display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 18px; align-items: start; }

    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow-sm);
    }
    .card-head {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; border-bottom: 1px solid var(--line-soft);
    }
    .card-title { font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; }
    .card-sub { font-size: 12px; color: var(--ink-4); }
    .card-body { padding: 16px; }
    .card-body.flush { padding: 0; }
    .card-icon {
      width: 30px; height: 30px; flex: none; border-radius: 9px; display: grid; place-items: center;
      background: var(--brand-soft); color: var(--brand);
    }
    .card-icon.success { background: var(--success-soft); color: var(--success); }
    .card-icon.danger  { background: var(--danger-soft);  color: var(--danger); }
    .card-icon.warning { background: var(--warning-soft); color: var(--warning); }
    .card-icon.info    { background: var(--info-soft);    color: var(--info); }
    .card-icon.neutral { background: var(--neutral-soft); color: var(--neutral); }

    /* greeting / hero */
    .hero {
      position: relative; overflow: hidden; border-radius: var(--radius);
      padding: 22px 24px; color: #E7ECF6;
      background: linear-gradient(125deg, #1B2440 0%, #232C52 45%, #2C2450 100%);
      box-shadow: var(--shadow-md);
    }
    .hero::after {
      content: ""; position: absolute; right: -80px; top: -110px;
      width: 320px; height: 320px; border-radius: 50%;
      background: radial-gradient(circle, rgba(139,92,246,.34), transparent 68%);
    }
    .hero-line { position: relative; font-size: 14.5px; line-height: 1.65; color: #C3CDE2; }
    .hero-line.lead { font-size: 18px; line-height: 1.5; font-weight: 620; color: #FFFFFF; letter-spacing: -.01em; }
    .hero-line em { font-style: normal; color: #86EFC4; font-weight: 650; }

    /* stat cards */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
    .stat {
      position: relative; text-align: left; font: inherit; cursor: pointer;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px 15px; box-shadow: var(--shadow-sm);
      transition: transform .12s, box-shadow .12s, border-color .12s;
      display: flex; flex-direction: column; gap: 9px; overflow: hidden;
    }
    .stat::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--accent, var(--neutral)); opacity: .85;
    }
    .stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--ink-4); }
    .stat.flat { cursor: default; }
    .stat.flat:hover { transform: none; box-shadow: var(--shadow-sm); border-color: var(--line); }
    .stat-top { display: flex; align-items: center; gap: 8px; }
    .stat-chip {
      width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center;
      background: var(--accent-soft, var(--neutral-soft)); color: var(--accent, var(--neutral));
    }
    .stat-label {
      font-size: 11.5px; font-weight: 600; letter-spacing: .02em; color: var(--ink-3);
      text-transform: uppercase;
    }
    .stat-value {
      font-size: 25px; line-height: 30px; font-weight: 680; letter-spacing: -.025em;
      color: var(--ink); font-variant-numeric: tabular-nums;
    }
    .stat-value.sm { font-size: 20px; line-height: 26px; }
    .stat-foot { font-size: 11.5px; color: var(--ink-4); }
    .stat.t-success { --accent: var(--success); --accent-soft: var(--success-soft); }
    .stat.t-danger  { --accent: var(--danger);  --accent-soft: var(--danger-soft); }
    .stat.t-warning { --accent: var(--warning); --accent-soft: var(--warning-soft); }
    .stat.t-info    { --accent: var(--info);    --accent-soft: var(--info-soft); }
    .stat.t-brand   { --accent: var(--brand);   --accent-soft: var(--brand-soft); }
    .stat.t-neutral { --accent: var(--neutral); --accent-soft: var(--neutral-soft); }

    /* text tones */
    .t-secondary { color: var(--ink-2); }
    .t-tertiary  { color: var(--ink-3); }
    .t-quaternary{ color: var(--ink-4); }
    .t-danger    { color: var(--danger); }
    .t-warning   { color: var(--warning); }
    .t-success   { color: var(--success); }
    .t-info      { color: var(--info); }
    .t-neutral   { color: var(--ink-3); }
    .t-small { font-size: 12px; line-height: 17px; }
    .w-semibold { font-weight: 640; }
    .num { font-variant-numeric: tabular-nums; }

    /* badges */
    .badge {
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
      font-size: 11.5px; font-weight: 620; line-height: 16px;
      padding: 3px 9px; border-radius: 999px;
      background: var(--neutral-soft); color: var(--ink-2);
    }
    .badge.success { background: var(--success-soft); color: #0B7B56; }
    .badge.danger  { background: var(--danger-soft);  color: #BE123C; }
    .badge.warning { background: var(--warning-soft); color: #B45309; }
    .badge.info    { background: var(--info-soft);    color: #1D4ED8; }
    .badge.brand   { background: var(--brand-soft);   color: var(--brand-ink); }

    /* controls */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 9px; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid var(--line-soft);
    }
    .search {
      position: relative; display: inline-flex; align-items: center;
      flex: 1 1 240px; max-width: 340px; min-width: 190px;
    }
    .search .ic { position: absolute; left: 10px; color: var(--ink-4); pointer-events: none; }
    input[type="search"] {
      width: 100%; height: 34px; padding: 4px 10px 4px 32px;
      font: inherit; font-size: 13px; color: var(--ink);
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--surface); outline: none; appearance: none; -webkit-appearance: none;
      transition: border-color .12s, box-shadow .12s;
    }
    input[type="search"]:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.13); }
    input[type="search"]::-webkit-search-decoration,
    input[type="search"]::-webkit-search-cancel-button,
    input[type="search"]::-webkit-search-results-button,
    input[type="search"]::-webkit-search-results-decoration { -webkit-appearance: none; appearance: none; display: none; }

    .select-wrap { position: relative; display: inline-flex; align-items: center; }
    .select-wrap .ic { position: absolute; right: 9px; pointer-events: none; color: var(--ink-4); }
    select {
      font: inherit; font-size: 13px; color: var(--ink); height: 34px;
      padding: 4px 30px 4px 11px; cursor: pointer; outline: none;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--surface); appearance: none; -webkit-appearance: none;
      transition: border-color .12s, box-shadow .12s;
    }
    select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.13); }

    .chip {
      font: inherit; font-size: 12px; font-weight: 550; line-height: 16px;
      padding: 5px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap;
      background: var(--surface); color: var(--ink-2); border: 1px solid var(--line);
      transition: all .12s;
    }
    .chip:hover { border-color: var(--ink-4); color: var(--ink); }
    .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }

    .btn {
      display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 13px;
      font-weight: 560; padding: 7px 13px; border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
      transition: all .12s;
    }
    .btn:hover { border-color: var(--ink-4); color: var(--ink); box-shadow: var(--shadow-sm); }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn.primary:hover { background: var(--brand-ink); border-color: var(--brand-ink); color: #fff; }
    .btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

    /* tables */
    .table-frame { width: 100%; overflow-x: auto; }
    .table-frame.compact { width: max-content; max-width: 100%; }
    table.grid {
      min-width: 100%; border-collapse: separate; border-spacing: 0;
      font-size: 13.5px; color: var(--ink);
    }
    .table-frame.compact table.grid { min-width: 0; }
    table.grid th {
      position: sticky; top: 0; z-index: 2; white-space: nowrap;
      padding: 10px 14px; text-align: left;
      font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
      color: var(--ink-3); background: #FAFBFD;
      border-bottom: 1px solid var(--line);
    }
    table.grid td {
      padding: 10px 14px; vertical-align: top;
      border-bottom: 1px solid var(--line-soft);
    }
    table.grid tbody tr:last-child td { border-bottom: none; }
    table.grid tbody tr:hover td { background: #FAFBFF; }
    table.grid tbody tr.total-row td { background: #F8FAFC; font-weight: 600; }
    table.grid tbody tr.total-row:hover td { background: #F8FAFC; }
    table.grid .num { text-align: right; font-variant-numeric: tabular-nums; }
    table.grid .center { text-align: center; }
    table.grid .empty { padding: 34px 14px; text-align: center; color: var(--ink-4); }

    .cell-marker { display: inline-flex; align-items: flex-start; gap: 7px; min-width: 0; max-width: 100%; }
    .marker { width: 6px; height: 6px; margin-top: 7px; border-radius: 50%; flex: none; }
    .marker-success { background: var(--success); }
    .marker-danger  { background: var(--danger); }
    .marker-warning { background: var(--warning); }
    .marker-info    { background: var(--info); }
    .marker-neutral { background: var(--ink-4); }

    .reason-cell { min-width: 300px; max-width: 620px; white-space: normal; line-height: 1.65; font-size: 12.5px; }
    .action-cell { min-width: 210px; max-width: 420px; white-space: normal; line-height: 1.55; font-size: 12.5px; }
    .p7d-cell { display: inline-block; min-width: 150px; max-width: 220px; font-size: 12.5px; line-height: 1.5; }
    .sep { padding: 0 7px; color: var(--ink-4); }
    .players-table { min-width: 2900px; width: max-content; }
    .ticket-preview { font-size: 10.5px; color: var(--ink-4); max-width: 150px; line-height: 1.35; margin-top: 3px; }

    /* pagination */
    .pager {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      padding: 11px 16px; border-top: 1px solid var(--line-soft); background: #FCFDFF;
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .pager-info { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .pg {
      min-width: 30px; height: 30px; padding: 0 8px; display: inline-grid; place-items: center;
      font: inherit; font-size: 12.5px; font-weight: 560; font-variant-numeric: tabular-nums;
      border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
      color: var(--ink-2); cursor: pointer; transition: all .12s;
    }
    .pg:hover:not(:disabled) { border-color: var(--ink-4); color: var(--ink); }
    .pg.active { background: var(--ink); border-color: var(--ink); color: #fff; }
    .pg:disabled { opacity: .35; cursor: not-allowed; }
    .pg-gap { color: var(--ink-4); padding: 0 2px; }
    .pager select { height: 30px; font-size: 12.5px; padding: 3px 26px 3px 9px; }

    /* goals */
    .goal-score { display: flex; align-items: baseline; gap: 10px; }
    .goal-pct { font-size: 34px; line-height: 38px; font-weight: 700; letter-spacing: -.03em; }
    .meter { height: 7px; border-radius: 999px; background: var(--neutral-soft); overflow: hidden; }
    .meter > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6366F1, #8B5CF6); }
    .meter.success > span { background: linear-gradient(90deg, #0E9F6E, #34D399); }
    .meter.warning > span { background: linear-gradient(90deg, #D97706, #FBBF24); }
    .meter.danger  > span { background: linear-gradient(90deg, #E11D48, #FB7185); }

    /* Score meter: two separate tracks, the 80-point KPI block and the
       manager's 20, split by a real gap and individually rounded so the two
       never read as one continuous bar. */
    .score-meter { display: flex; gap: 6px; height: 9px; }
    .score-meter .trk {
      display: flex; border-radius: 999px; overflow: hidden;
      background: var(--neutral-soft);
    }
    .score-meter .trk.kpi { flex: 0 0 calc(80% - 6px); }
    .score-meter .trk.mgr { flex: 0 0 20%; }
    .score-meter .trk.pending {
      background: transparent;
      border: 1px dashed var(--line-strong, var(--line));
    }
    .score-meter .fill { height: 100%; border-radius: 999px; }
    .score-meter .fill.success { background: linear-gradient(90deg, #0E9F6E, #34D399); }
    .score-meter .fill.warning { background: linear-gradient(90deg, #D97706, #FBBF24); }
    .score-meter .fill.danger  { background: linear-gradient(90deg, #E11D48, #FB7185); }
    .score-meter .fill.mgr     { background: linear-gradient(90deg, #6D5CE0, #9386F2); }
    .score-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11.5px; color: var(--ink-4); }
    .score-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    .score-legend i.lg-success { background: #34D399; }
    .score-legend i.lg-warning { background: #FBBF24; }
    .score-legend i.lg-danger  { background: #FB7185; }
    .score-legend i.lg-mgr     { background: #9386F2; }
    .t-manager { color: #9386F2; }
    .note { font-size: 11.5px; line-height: 1.6; color: var(--ink-4); }

    /* ---------- archive calendar ---------- */
    .cal-wrap { position: relative; flex: none; }
    .cal-btn {
      display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px;
      border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
      color: var(--ink-2); cursor: pointer; font: inherit; font-size: 12.5px;
      font-weight: 600; transition: all .12s; white-space: nowrap;
    }
    .cal-btn:hover { color: var(--ink); border-color: var(--ink-4); box-shadow: var(--shadow-sm); }
    .cal-pop {
      position: absolute; right: 0; top: 38px; z-index: 60; width: 276px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: var(--shadow-md); padding: 12px;
    }
    .cal-head { display: flex; align-items: center; gap: 6px; margin-bottom: 9px; }
    .cal-title { flex: 1 1 auto; text-align: center; font-size: 12.5px; font-weight: 700; }
    .cal-nav {
      width: 26px; height: 26px; flex: none; display: grid; place-items: center;
      border-radius: 7px; border: 1px solid var(--line); background: var(--surface);
      color: var(--ink-3); cursor: pointer;
    }
    .cal-nav:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-4); }
    .cal-nav:disabled { opacity: .35; cursor: default; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dow {
      text-align: center; font-size: 10px; font-weight: 700; letter-spacing: .04em;
      color: var(--ink-4); padding-bottom: 3px;
    }
    .cal-day {
      aspect-ratio: 1 / 1; display: grid; place-items: center; border-radius: 8px;
      border: 1px solid transparent; background: none; font: inherit; font-size: 12px;
      color: var(--ink-4); cursor: default; padding: 0;
    }
    .cal-day.has {
      color: var(--ink); font-weight: 600; cursor: pointer;
      background: var(--neutral-soft); border-color: var(--line);
    }
    .cal-day.has:hover { border-color: var(--brand, var(--ink-4)); color: var(--ink); }
    .cal-day.today { outline: 2px solid var(--brand, #6366F1); outline-offset: -2px; }
    .cal-day.empty { visibility: hidden; }
    .cal-foot { margin-top: 9px; font-size: 11px; color: var(--ink-4); line-height: 1.5; }

    /* gate */
    .gate {
      max-width: 430px; margin: 60px auto; text-align: center;
      background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
      padding: 34px 30px; box-shadow: var(--shadow-md);
    }
    .gate-mark {
      width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px; display: grid; place-items: center;
      background: linear-gradient(140deg, #1E293B, #4338CA); color: #fff;
      box-shadow: 0 8px 22px rgba(67,56,202,.32);
    }
    .gate h2 { margin: 0 0 6px; font-size: 19px; font-weight: 660; letter-spacing: -.02em; }
    .gate p { margin: 0 0 20px; font-size: 13px; color: var(--ink-3); line-height: 1.6; }
    .gate input {
      width: 100%; height: 40px; text-align: center; letter-spacing: .28em; font: inherit; font-size: 15px;
      border: 1px solid var(--line); border-radius: var(--radius-sm); outline: none; color: var(--ink);
      background: var(--surface);
    }
    .gate input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.13); }
    .gate .err { color: var(--danger); font-size: 12.5px; margin-top: 10px; min-height: 17px; }

    /* modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,.52); backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 22px;
    }
    .modal-card {
      background: var(--surface); border-radius: 18px; max-width: 700px; width: 100%;
      max-height: 90vh; overflow: auto; box-shadow: var(--shadow-lg);
    }
    .modal-head {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 18px 20px 14px; border-bottom: 1px solid var(--line-soft);
    }
    .modal-body { padding: 18px 20px; }
    .modal-foot {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 14px 20px; border-top: 1px solid var(--line-soft); background: #FBFCFE;
      border-radius: 0 0 18px 18px;
    }
    .field-label {
      font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
      color: var(--ink-3); margin-bottom: 6px;
    }
    .modal-card input[type="text"], .modal-card textarea {
      width: 100%; margin-bottom: 16px; padding: 9px 11px; font: inherit; font-size: 13px;
      border-radius: var(--radius-sm); border: 1px solid var(--line);
      color: var(--ink); background: var(--surface); outline: none;
    }
    .modal-card input[type="text"]:focus, .modal-card textarea:focus {
      border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.13);
    }
    .modal-card textarea { resize: vertical; min-height: 190px; line-height: 1.6; }

    .toast {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: #fff; font-size: 13px; font-weight: 550;
      padding: 9px 16px; border-radius: 999px; z-index: 1200; box-shadow: var(--shadow-lg);
      display: flex; align-items: center; gap: 7px;
    }

    @media (max-width: 900px) {
      .sidebar { position: fixed; z-index: 50; transform: translateX(-100%); transition: transform .18s; }
      .app.mobile-open .sidebar { transform: translateX(0); }
      .content, .topbar { padding-left: 16px; padding-right: 16px; }
    }
    @media print {
      .sidebar, .topbar, .toolbar, .pager, .chip-row { display: none !important; }
      .content { padding: 0; }
      .card { break-inside: avoid; box-shadow: none; }
    }
  </style>

    const scored = AGENTS.filter((a) => a.goals && a.goals.available).map((a) => {
      var _a;
      const kpis = a.goals.kpis || [];
      const sc = a.goals.score || {};
      return {
        name: a.agentName,
        score: sc,
        pct: Number((_a = sc.totalPctOfMax) != null ? _a : a.goals.weightedTrackedPct),
        kpiPct: Number(a.goals.weightedTrackedPct),
        onTrack: kpis.filter((k) => k.statusTone === "success").length,
        behind: kpis.filter((k) => k.statusTone === "danger" || k.statusTone === "warning").length,
        total: kpis.length
      };
    }).sort((a, b) => (b.pct || 0) - (a.pct || 0));
    const leaderRows = scored.map((s, i) => {
      const tone = s.kpiPct >= 90 ? "success" : s.kpiPct >= 70 ? "warning" : "danger";
      return [
        `<span class="badge ${i === 0 ? "brand" : ""}">${i + 1}</span>`,
        `<button type="button" class="chip" data-agent="${esc(s.name)}">${esc(s.name)}</button>`,
        `<span class="w-semibold t-${tone}">${esc(s.score.totalDisplay || "\u2014")}</span>`,
        `<div style="min-width:150px">${scoreMeterHtml(s.score, tone)}</div>`,
        s.score.managerScored ? `<span class="t-manager w-semibold">${esc(s.score.managerPointsDisplay)}</span>` : `<span class="t-quaternary">Pending</span>`,
        `<span class="t-success w-semibold">${s.onTrack}</span>`,
        `<span class="${s.behind ? "t-danger w-semibold" : "t-quaternary"}">${s.behind}</span>`
      ];
    });
    const shareRows = AM_SHARES.map((r) => [
      `<button type="button" class="chip" data-agent="${esc(r.agentName)}">${esc(r.agentName)}</button>`,
      `<span class="t-success w-semibold">${esc(r.purchase)}</span>`,
      esc(r.purchaseShare),
      esc(r.purchasedOfBook || r.purchasedPlayers)
    ]);
    const ovRows = OVERVIEW.map((r) => [
      `<button type="button" class="chip" data-agent="${esc(r.agentName)}">${esc(r.agentName)}</button>`,
      `<span class="t-success w-semibold">${esc(r.purchase)}</span>`,
      esc(r.purchasedOfBook || r.purchasedPlayers),
      esc(r.openZd),
      esc(r.takeABreak),
      esc(r.locked),
      esc(r.rdOver5k),
      `<span class="t-success">${esc(r.birthdays)}</span>`,
      esc(r.declineCount)
    ]);
    const greet = (REPORT.overviewGreetingLines || []).map((line, i) => richText(line, i === 0)).join("");
    return `<div class="stack">
        ${greet ? `<div class="hero"><div class="stack-6">${greet}</div></div>` : ""}
        <div class="stats">${cards.map(statCard).join("")}</div>

        ${teamGoalsCard()}

        ${scored.length ? `<div class="card">
          <div class="card-head">
            <span class="card-icon">${icon("target", "ic-sm")}</span>
            <div><div class="card-title">Goals Leaderboard</div>
            <div class="card-sub">80 KPI points + your 20 of appreciation \xB7 ranked on share of the applicable maximum</div></div>
          </div>
          ${tableHtml(
      ["#", "AM", "Score", "", "Manager", "On track", "Needs attention"],
      leaderRows,
      ["center", "left", "right", "left", "right", "right", "right"],
      scored.map((s) => s.kpiPct >= 90 ? "success" : s.kpiPct >= 70 ? "warning" : "danger"),
      { markerCol: 1 }
    )}
        </div>` : ""}

        <div class="grid-2">
          <div class="card">
            <div class="card-head">
              <span class="card-icon success">${icon("pie", "ic-sm")}</span>
              <div class="card-title">AM Share Of Elite</div>
            </div>
            ${tableHtml(
      ["AM", "Purchase $", "Share", "Purchased Of Portfolio"],
      shareRows,
      ["left", "right", "right", "right"],
      AM_SHARES.map(() => "success"),
      { markerCol: 1 }
    )}
          </div>
          ${segmentCard()}
        </div>

        <div class="card">
          <div class="card-head">
            <span class="card-icon info">${icon("list", "ic-sm")}</span>
            <div><div class="card-title">AM Overview</div>
            <div class="card-sub">Click an AM to open their board</div></div>
          </div>
          ${tableHtml(
      [
        "AM",
        "Purchase $",
        "Purchased Of Portfolio",
        "Open Tickets",
        "Take A Break",
        "Locked",
        "Pending RD",
        "Birthdays",
        "Top 20 Decline"
      ],
      ovRows,
      ["left", "right", "right", "right", "right", "right", "right", "right", "right"],
      OVERVIEW.map(() => "success"),
      { markerCol: 1 }
    )}
        </div>
      </div>`;
  }
  function gateHtml() {
    return `<div class="gate">
        <div class="gate-mark">${icon("key", "ic-xl")}</div>
        <h2>Manager Dashboard</h2>
        <p>Cross-AM revenue, goals and risk roll-up. Enter the passcode to view.</p>
        <input type="password" id="gateInput" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022" autocomplete="off" spellcheck="false">
        <div class="err">${esc(app.gateError)}</div>
        <button type="button" class="btn primary" id="gateSubmit" style="width:100%;justify-content:center">
          ${icon("unlock", "ic-sm")} Unlock
        </button>
      </div>`;
  }
  function navCount(viewId) {
    const v = VIEWS[viewId];
    if (!v || !v.key) return null;
    return rowsFor(v.key).length;
  }
  function countTone(viewId, n) {
    if (!n) return "";
    if (["top20", "rd", "locks", "rdfirst"].includes(viewId)) return "warm";
    if (["top10", "birthdays"].includes(viewId)) return "good";
    return "";
  }
  function sidebar() {
    const visible = NAV_ORDER.filter((id) => !(VIEWS[id].managerOnly && SINGLE_AM));
    let nav = "";
    for (const group of GROUP_ORDER) {
      const items = visible.filter((id) => VIEWS[id].group === group);
      if (!items.length) continue;
      nav += `<div class="side-group-title">${esc(group)}</div>`;
      nav += items.map((id) => {
        const v = VIEWS[id];
        const n = navCount(id);
        return `<button type="button" class="nav-item ${app.view === id ? "active" : ""}" data-go="${esc(id)}">
            ${icon(v.icon)}
            <span class="side-label">${esc(v.short || v.label)}</span>
            ${v.gated && !app.unlocked ? icon("lock", "ic-xs") : n !== null ? `<span class="nav-count ${countTone(id, n)}">${n}</span>` : ""}
          </button>`;
      }).join("");
    }
    const amSwitch = !SINGLE_AM && AM_ORDER.length > 1 ? `<div class="am-switch">
        <div class="am-switch-title">Account Manager</div>
        <div class="am-chips">${AM_ORDER.map(
      (name) => `<button type="button" class="am-chip ${app.agent === name ? "active" : ""}" data-agent="${esc(name)}">${esc(name)}</button>`
    ).join("")}</div>
      </div>` : "";
    return `<aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">${icon("spark", "ic-lg")}</span>
          <div class="brand-text">
            <div class="brand-title">${esc(REPORT.title || "Elite AM Brief")}</div>
            <div class="brand-sub">${esc(REPORT.subtitle || "")}</div>
          </div>
        </div>
        ${amSwitch}
        <nav class="side-nav">${nav}</nav>
        <div class="side-foot">
          ${SINGLE_AM ? esc(app.agent) + " \xB7 personal board" : "Manager view \xB7 all AMs"}<br>
          Report date ${esc(REPORT.date || "")}
        </div>
      </aside>`;
  }
  var ARCHIVE = REPORT.archive || [];
  var ARCHIVE_BY_DATE = new Map(ARCHIVE.map((a) => [a.d, a.f]));
  var ARCHIVE_MONTHS = [...new Set(ARCHIVE.map((a) => a.d.slice(0, 7)))].sort();
  var MONTH_NAMES = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
  ];
  function shiftMonth(ym, delta) {
    const y = Number(ym.slice(0, 4));
    const m = Number(ym.slice(5, 7)) + delta;
    const d = new Date(Date.UTC(y, m - 1, 1));
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}`;
  }
  function calendarPopHtml() {
    const ym = app.calMonth || (REPORT.date || "").slice(0, 7);
    const year = Number(ym.slice(0, 4));
    const month = Number(ym.slice(5, 7));
    const firstDow = new Date(Date.UTC(year, month - 1, 1)).getUTCDay();
    const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
    const canPrev = ARCHIVE_MONTHS.some((m) => m < ym);
    const canNext = ARCHIVE_MONTHS.some((m) => m > ym);
    let cells = "";
    for (let i = 0; i < firstDow; i++) cells += `<span class="cal-day empty"></span>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${ym}-${String(d).padStart(2, "0")}`;
      const file = ARCHIVE_BY_DATE.get(iso);
      const isCurrent = iso === REPORT.date;
      if (file) {
        cells += `<button type="button" class="cal-day has${isCurrent ? " today" : ""}"
            data-cal-open="${esc(file)}" title="Open the brief for ${esc(iso)}">${d}</button>`;
      } else {
        cells += `<span class="cal-day" title="No brief for ${esc(iso)}">${d}</span>`;
      }
    }
    return `<div class="cal-pop" id="calPop">
        <div class="cal-head">
          <button type="button" class="cal-nav" data-cal-month="${esc(shiftMonth(ym, -1))}"
            ${canPrev ? "" : "disabled"} title="Previous month">${icon("chev-left", "ic-xs")}</button>
          <div class="cal-title">${esc(MONTH_NAMES[month - 1])} ${year}</div>
          <button type="button" class="cal-nav" data-cal-month="${esc(shiftMonth(ym, 1))}"
            ${canNext ? "" : "disabled"} title="Next month">${icon("chev-right", "ic-xs")}</button>
        </div>
        <div class="cal-grid">
          ${["S", "M", "T", "W", "T", "F", "S"].map((d) => `<div class="cal-dow">${d}</div>`).join("")}
          ${cells}
        </div>
        <div class="cal-foot">${ARCHIVE.length ? `${ARCHIVE.length} brief${ARCHIVE.length === 1 ? "" : "s"} saved. Highlighted days have a report; the rest were not generated.` : "No other briefs saved yet \u2014 history starts from this one."}</div>
      </div>`;
  }
  function topbar() {
    const v = VIEWS[app.view] || VIEWS.home;
    const isManager = !!v.managerOnly;
    const who = isManager ? "All AMs" : app.agent;
    return `<header class="topbar">
        <button type="button" class="icon-btn" id="toggleSidebar" title="Toggle menu">${icon("panel", "ic-sm")}</button>
        <div class="crumb">
          <div class="crumb-top">${esc(v.group)}</div>
          <div class="crumb-title">${icon(v.icon, "ic-lg")}${esc(v.label)}</div>
        </div>
        <div class="spacer"></div>
        <div class="cal-wrap">
          <button type="button" class="cal-btn" id="calBtn" title="Open another day's brief">
            ${icon("calendar", "ic-sm")}${esc(REPORT.subtitle || REPORT.date || "")}
          </button>
          ${app.calOpen ? calendarPopHtml() : ""}
        </div>
        <button type="button" class="icon-btn" id="printBtn" title="Print / save as PDF">${icon("printer", "ic-sm")}</button>
        <div class="who">
          <span class="who-dot">${esc(isManager ? "ALL" : initials(who))}</span>
          <div><div class="who-name">${esc(who)}</div>
          <div class="who-role">${esc(v.sub || "")}</div></div>
        </div>
      </header>`;
  }
  var VIEW_FN = {
    dashboard: viewDashboard,
    team: viewTeamGoals,
    home: viewHome,
    goals: viewGoals,
    top10: viewTop10,
    top20: viewTop20,
    rd: viewPendingRd,
    rdfirst: viewFirstRd,
    tickets: viewTickets,
    locks: viewLocks,
    birthdays: viewBirthdays
  };
  function renderModal() {
    const root = document.getElementById("modalRoot");
    const p = app.ticket;
    if (!p) {
      root.innerHTML = "";
      return;
    }
    root.innerHTML = `<div class="modal-backdrop" id="backdrop">
        <div class="modal-card" id="card">
          <div class="modal-head">
            <span class="card-icon">${icon("ticket", "ic-sm")}</span>
            <div>
              <div class="card-title">Zendesk draft \xB7 ${esc(p.name)}</div>
              <div class="card-sub">AID ${esc(p.aid)} \xB7 review only, nothing is auto-sent</div>
            </div>
            <div class="spacer"></div>
            <button type="button" class="icon-btn" id="closeX">${icon("x", "ic-sm")}</button>
          </div>
          <div class="modal-body">
            <div class="field-label">Subject</div>
            <input type="text" id="tSubject" value="${esc(p.ticketSubject || "")}">
            <div class="field-label">Message</div>
            <textarea id="tBody" rows="11">${esc(p.ticketBody || "")}</textarea>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn" id="copySubject">${icon("copy", "ic-xs")} Subject</button>
            <button type="button" class="btn" id="copyBody">${icon("copy", "ic-xs")} Message</button>
            <button type="button" class="btn" id="copyBoth">${icon("copy", "ic-xs")} Both</button>
            <div class="spacer"></div>
            <button type="button" class="btn primary" id="openZd">${icon("external", "ic-xs")} Open Zendesk</button>
          </div>
        </div>
      </div>`;
    const close = () => {
      app.ticket = null;
      render();
    };
    const val = (id) => document.getElementById(id).value;
    const copy = (text, what) => {
      navigator.clipboard.writeText(text);
      toast(what + " copied");
    };
    document.getElementById("backdrop").onclick = (e) => {
      if (e.target.id === "backdrop") close();
    };
    document.getElementById("closeX").onclick = close;
    document.getElementById("copySubject").onclick = () => copy(val("tSubject"), "Subject");
    document.getElementById("copyBody").onclick = () => copy(val("tBody"), "Message");
    document.getElementById("copyBoth").onclick = () => copy(`Subject: ${val("tSubject")}

${val("tBody")}`, "Subject + message");
    document.getElementById("openZd").onclick = () => {
      if (p.zendeskUrl) window.open(p.zendeskUrl, "_blank", "noopener,noreferrer");
    };
  }
  function bind() {
    const calBtn = document.getElementById("calBtn");
    if (calBtn) calBtn.onclick = (e) => {
      e.stopPropagation();
      app.calOpen = !app.calOpen;
      if (app.calOpen) app.calMonth = (REPORT.date || "").slice(0, 7);
      render();
    };
    document.querySelectorAll("[data-cal-month]").forEach((el) => {
      el.onclick = (e) => {
        e.stopPropagation();
        app.calMonth = el.getAttribute("data-cal-month");
        render();
      };
    });
    document.querySelectorAll("[data-cal-open]").forEach((el) => {
      el.onclick = () => {
        window.location.href = el.getAttribute("data-cal-open");
      };
    });
    const calPop = document.getElementById("calPop");
    if (calPop) calPop.onclick = (e) => e.stopPropagation();
    document.querySelectorAll("[data-go]").forEach((el) => {
      el.onclick = () => go(el.getAttribute("data-go"));
    });
    document.querySelectorAll("[data-agent]").forEach((el) => {
      el.onclick = () => {
        app.agent = el.getAttribute("data-agent");
        if (app.view === "dashboard") app.view = "home";
        render();
        window.scrollTo({ top: 0, behavior: "auto" });
      };
    });
    document.querySelectorAll("input[data-state]").forEach((el) => {
      el.oninput = () => setState(el.getAttribute("data-state"), el.value);
    });
    document.querySelectorAll("select[data-state]").forEach((el) => {
      el.onchange = () => setState(el.getAttribute("data-state"), el.value);
    });
    document.querySelectorAll("[data-reason-state]").forEach((el) => {
      el.onclick = () => setState(el.getAttribute("data-reason-state"), el.getAttribute("data-reason"));
    });
    document.querySelectorAll("[data-page-key]").forEach((el) => {
      el.onclick = () => {
        setPage(el.getAttribute("data-page-key"), Number(el.getAttribute("data-page")));
      };
    });
    document.querySelectorAll("[data-ticket-aid]").forEach((el) => {
      el.onclick = () => {
        const aid = el.getAttribute("data-ticket-aid");
        const b = agentBlock();
        const pool = [...b.decline || [], ...b.rdFirstTime || [], ...b.birthdays || []];
        const p = pool.find((x) => String(x.aid) === aid);
        if (p) {
          app.ticket = p;
          render();
        }
      };
    });
    const toggle = document.getElementById("toggleSidebar");
    if (toggle) toggle.onclick = () => {
      if (window.matchMedia("(max-width: 900px)").matches) app.mobileOpen = !app.mobileOpen;
      else app.collapsed = !app.collapsed;
      render();
    };
    const printBtn = document.getElementById("printBtn");
    if (printBtn) printBtn.onclick = () => window.print();
    const gateInput = document.getElementById("gateInput");
    if (gateInput) {
      const submit = () => {
        if (gateToken(gateInput.value) === GATE_TOKEN) {
          app.unlocked = true;
          app.gateError = "";
          rememberGate();
        } else {
          app.gateError = "That passcode does not match.";
        }
        render();
      };
      gateInput.onkeydown = (e) => {
        if (e.key === "Enter") submit();
      };
      document.getElementById("gateSubmit").onclick = submit;
      if (!app.gateError) gateInput.focus();
    }
    const focusKey2 = takeFocusKey();
    if (focusKey2) {
      const el = document.querySelector(`[data-state="${CSS.escape(focusKey2)}"]`);
      if (el && el.tagName === "INPUT") {
        el.focus();
        const end = el.value.length;
        try {
          el.setSelectionRange(end, end);
        } catch (e) {
        }
      }
    }
  }
  function render() {
    if (app.view === "goals" && !agentBlock().goals) app.view = "home";
    if (VIEWS[app.view] && VIEWS[app.view].managerOnly && SINGLE_AM) app.view = "home";
    const body = (VIEW_FN[app.view] || viewHome)();
    document.getElementById("root").innerHTML = `<div class="app${app.collapsed ? " collapsed" : ""}${app.mobileOpen ? " mobile-open" : ""}">
        ${sidebar()}
        <div class="main">
          ${topbar()}
          <div class="content">${body}</div>
        </div>
      </div>`;
    document.title = `${REPORT.title || "Elite AM Brief"} \xB7 ${REPORT.date || ""}`;
    bind();
    renderModal();
  }
  document.addEventListener("click", () => {
    if (app.calOpen) {
      app.calOpen = false;
      render();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && app.calOpen) {
      app.calOpen = false;
      render();
    }
  });
  setRenderHook(render);
  render();
})();
  </script>
</body>
</html>
